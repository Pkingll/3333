<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Cairo;
background:#06131f;
color:#fff;
}

.header{
text-align:center;
padding:20px;
color:#f5e6b3;
font-size:22px;
}

.container{
width:92%;
max-width:900px;
margin:auto;
}

.card{
background:rgba(5,15,30,.65);
padding:15px;
margin:10px 0;
border-radius:15px;
}

button,select{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:10px;
}

button{
background:#d4af37;
font-weight:bold;
cursor:pointer;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.item{
background:#0d2033;
padding:10px;
margin-top:10px;
border-radius:10px;
}

.actions{
display:flex;
gap:5px;
margin-top:10px;
}

.actions button{
flex:1;
}

.delete{background:#b91c1c;color:#fff}
.edit{background:#2563eb;color:#fff}
</style>
</head>

<body>

<div class="header">لوحة التحكم</div>

<div class="container">

<div class="card">
<select id="subject">
<option value="aqida">العقيدة</option>
<option value="hadith">الحديث</option>
<option value="fiqh">الفقه</option>
<option value="usul">أصول الفقه</option>
<option value="history">التاريخ</option>
<option value="dawah">الدعوة</option>
<option value="tajweed">التجويد</option>
<option value="literature">الأدب</option>
<option value="nahw">النحو</option>
<option value="computer">الحاسوب</option>
<option value="english">الإنجليزي</option>
<option value="tafsir">التفسير</option>
</select>
</div>

<div class="card">
<div class="grid">
<button onclick="addTitle()">عنوان</button>
<button onclick="addText()">نص</button>
<button onclick="addImage()">صورة</button>
<button onclick="addBook()">كتاب</button>
<button onclick="addLink()">رابط</button>
<button onclick="addAudio()">صوت</button>
</div>
</div>

<div class="card" id="preview"></div>

<button onclick="saveData()">💾 حفظ</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAVHnPVmRegwOQGTugDN7oltRqlSM-5_wA",
authDomain: "p-726bc.firebaseapp.com",
projectId: "p-726bc",
storageBucket: "p-726bc.firebasestorage.app",
messagingSenderId: "752913389065",
appId: "1:752913389065:web:20cf8c03fe4ace03650ad8"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let items = [];

window.addTitle=()=>{let t=prompt("عنوان");if(t)items.push({type:"title",text:t});render();}
window.addText=()=>{let t=prompt("نص");if(t)items.push({type:"text",text:t});render();}
window.addImage=()=>{let u=prompt("رابط");if(u)items.push({type:"image",url:u});render();}
window.addBook=()=>{let n=prompt("اسم");let u=prompt("رابط");if(n&&u)items.push({type:"book",name:n,url:u});render();}
window.addLink=()=>{let n=prompt("اسم");let u=prompt("رابط");if(n&&u)items.push({type:"link",name:n,url:u});render();}
window.addAudio=()=>{let n=prompt("اسم الصوت");let u=prompt("رابط");if(n&&u)items.push({type:"audio",name:n,url:u});render();}

function render(){
let p=document.getElementById("preview");
p.innerHTML="";
items.forEach((it,i)=>{
p.innerHTML+=`
<div class="item">
${it.text || it.name || it.url}
<button onclick="deleteItem(${i})">حذف</button>
</div>`;
});
}

window.deleteItem=(i)=>{items.splice(i,1);render();}

window.saveData=async()=>{
let s=document.getElementById("subject").value;
await setDoc(doc(db,"subjects",s),{items});
alert("تم الحفظ");
};

</script>

</body>
</html>
