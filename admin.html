
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Cairo,sans-serif}

body{
background:#06131f;
color:#fff;
min-height:100vh;
}

body:before{
content:"";
position:fixed;
inset:0;
z-index:-1;
background:
linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.85)),
url('https://a.top4top.io/p_38068co2c0.jpg');
background-size:cover;
background-position:center;
}

.header{
text-align:center;
padding:20px;
color:#f5e6b3;
font-size:24px;
font-weight:700;
}

.container{
width:95%;
max-width:900px;
margin:auto;
padding-bottom:120px;
}

.card{
background:rgba(5,15,30,.65);
border-radius:18px;
padding:16px;
margin-bottom:15px;
}

select,button,input,textarea{
width:100%;
padding:12px;
border:none;
border-radius:12px;
margin-top:10px;
font-family:Cairo;
}

button{
background:#d4af37;
color:#06131f;
font-weight:bold;
cursor:pointer;
}

.item{
background:#0d2033;
padding:10px;
margin-top:10px;
border-radius:12px;
}

.actions{
display:flex;
gap:8px;
margin-top:10px;
}

.actions button{flex:1}

.moveUp{background:#9333ea;color:#fff}
.moveDown{background:#ea580c;color:#fff}

.edit{background:#2563eb;color:#fff}
.delete{background:#b91c1c;color:#fff}
.view{background:#16a34a;color:#fff}

hr{margin:15px 0;border:1px solid rgba(255,255,255,.1)}

/* ===== نافذة التعديل والعرض ===== */
.modal-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
z-index:9999;
display:none;
align-items:center;
justify-content:center;
padding:15px;
}

.modal-box{
background:#0d2033;
border-radius:18px;
padding:20px;
width:100%;
max-width:600px;
max-height:90vh;
overflow-y:auto;
border:2px solid #d4af37;
}

.modal-box h3{
color:#f5e6b3;
margin-bottom:15px;
text-align:center;
font-size:18px;
}

.modal-box label{
display:block;
color:#f5e6b3;
margin-top:12px;
margin-bottom:4px;
font-size:14px;
}

.modal-box input,
.modal-box textarea{
background:#06131f;
color:#fff;
border:1px solid rgba(255,255,255,.15);
margin-top:4px;
font-size:15px;
}

.modal-box textarea{
min-height:200px;
resize:vertical;
line-height:1.8;
}

.modal-actions{
display:flex;
gap:10px;
margin-top:20px;
}

.modal-actions button{
flex:1;
padding:14px;
font-size:16px;
border-radius:12px;
border:none;
cursor:pointer;
font-family:Cairo;
font-weight:bold;
}

.modal-save{
background:#16a34a;
color:#fff;
}

.modal-cancel{
background:#b91c1c;
color:#fff;
}

/* ===== نافذة عرض الدرس ===== */
.view-content{
background:#06131f;
border-radius:12px;
padding:15px;
color:#fff;
line-height:2;
white-space:pre-wrap;
word-wrap:break-word;
font-size:16px;
max-height:60vh;
overflow-y:auto;
}

.view-title{
color:#f5e6b3;
font-size:20px;
font-weight:700;
text-align:center;
margin-bottom:15px;
}
</style>
</head>

<body>

<div class="header">لوحة التحكم النهائية</div>

<div class="container">

<!-- النظام القديم -->
<div class="card">
<h3>📚 النظام القديم</h3>

<select id="subject">
<option value="aqida">العقيدة</option>
<option value="hadith">الحديث</option>
<option value="fiqh">الفقه</option>
<option value="usul">الأصول</option>
<option value="history">التاريخ</option>
<option value="dawah">الدعوة</option>
<option value="tajweed">التجويد</option>
<option value="literature">الأدب</option>
<option value="nahw">النحو</option>
<option value="computer">الحاسوب</option>
<option value="english">الإنجليزي</option>
<option value="tafsir">التفسير</option>
</select>

<button onclick="addTitle()">عنوان</button>
<button onclick="addText()">نص</button>
<button onclick="addImage()">صورة</button>
<button onclick="addBook()">كتاب</button>
<button onclick="addLink()">رابط</button>
<button onclick="addAudio()">صوت</button>
<button onclick="addVideo()">فيديو</button>

<div id="preview"></div>

<button onclick="saveOld()">حفظ</button>
</div>

<!-- الفصول -->
<div class="card">
<h3>📂 الفصول والدروس</h3>

<select id="subject2"></select>

<input id="chapterTitle" placeholder="اسم الفصل">
<button onclick="addChapter()">➕ إضافة فصل</button>

<div id="chaptersList"></div>

<hr>

<select id="chapterSelect"></select>

<input id="lessonTitle" placeholder="عنوان الدرس">
<textarea id="lessonText" placeholder="نص الدرس"></textarea>

<input id="lessonImage" placeholder="رابط صورة">
<button onclick="selectLessonImage()">📷 رفع صورة من الجهاز</button>

<input id="lessonAudio" placeholder="رابط صوت">
<button onclick="selectLessonAudio()">🎵 رفع صوت من الجهاز</button>

<input id="lessonVideo" placeholder="رابط فيديو">
<button onclick="selectLessonVideo()">🎬 رفع فيديو من الجهاز</button>

<input id="lessonLink" placeholder="رابط">

<button onclick="addLesson()">➕ إضافة درس</button>

<div id="lessonsList"></div>

</div>

</div>

<!-- ملفات الرفع المخفية -->
<input type="file" id="oldImageFile" accept="image/*" hidden>
<input type="file" id="oldAudioFile" accept="audio/*" hidden>
<input type="file" id="oldVideoFile" accept="video/*" hidden>

<input type="file" id="lessonImageFile" accept="image/*" hidden>
<input type="file" id="lessonAudioFile" accept="audio/*" hidden>
<input type="file" id="lessonVideoFile" accept="video/*" hidden>

<input type="file" id="editImageFile" accept="image/*" hidden>
<input type="file" id="editAudioFile" accept="audio/*" hidden>
<input type="file" id="editVideoFile" accept="video/*" hidden>

<!-- ===== نافذة تعديل الدرس ===== -->
<div class="modal-overlay" id="editModal">
<div class="modal-box">
<h3>✏️ تعديل الدرس</h3>

<label>عنوان الدرس:</label>
<input id="editTitle" type="text">

<label>نص الدرس:</label>
<textarea id="editText"></textarea>

<label>رابط الصورة:</label>
<input id="editImage" type="text">
<button onclick="selectEditImage()">📷 رفع صورة</button>

<label>رابط الصوت:</label>
<input id="editAudio" type="text">
<button onclick="selectEditAudio()">🎵 رفع صوت</button>

<label>رابط الفيديو:</label>
<input id="editVideo" type="text">
<button onclick="selectEditVideo()">🎬 رفع فيديو</button>

<label>الرابط:</label>
<input id="editLink" type="text">

<div class="modal-actions">
<button class="modal-save" onclick="saveEditLesson()">💾 حفظ التعديل</button>
<button class="modal-cancel" onclick="closeEditModal()">❌ إلغاء</button>
</div>
</div>
</div>

<!-- ===== نافذة عرض الدرس ===== -->
<div class="modal-overlay" id="viewModal">
<div class="modal-box">
<div class="view-title" id="viewTitle"></div>
<div class="view-content" id="viewContent"></div>
<div class="modal-actions">
<button class="modal-cancel" onclick="closeViewModal()">❌ إغلاق</button>
</div>
</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
query,
where,
deleteDoc,
doc,
updateDoc,
setDoc,
getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAVHnPVmRegwOQGTugDN7oltRqlSM5_ww",
authDomain: "p-726bc.firebaseapp.com",
projectId: "p-726bc"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ===== تطبيق خلفية المنصة المشتركة على لوحة التحكم ===== */
try{
 const backgroundSnap = await getDoc(doc(db,"settings","platform"));
 const backgroundUrl = backgroundSnap.exists() ? backgroundSnap.data().backgroundUrl : "";
 if(backgroundUrl){
   const sharedStyle = document.createElement("style");
   sharedStyle.id = "sharedPlatformBackgroundStyle";
   sharedStyle.textContent = `body:before{background-image:linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.85)),url("${backgroundUrl}");}`;
   document.head.appendChild(sharedStyle);
 }
}catch(backgroundError){
 console.log("تعذر تحميل خلفية المنصة المشتركة:",backgroundError);
}


/* ================= إعداد ImageKit ================= */

const IMAGEKIT_PUBLIC_KEY = "public_NrPNz9r5yR8M+rvPnJnY0adp4po=";

const IMAGEKIT_AUTH_URL =
"https://talibatt-image.alfzhm9.workers.dev";

async function uploadToImageKit(file){

if(!file){
throw new Error("لم يتم اختيار ملف");
}

const authResponse = await fetch(IMAGEKIT_AUTH_URL,{
method:"POST"
});

if(!authResponse.ok){
throw new Error("تعذر الاتصال بخدمة التوثيق. تحققي من إعدادات Cloudflare.");
}

const auth = await authResponse.json();

if(!auth.token || !auth.signature || !auth.expire){
throw new Error("بيانات التوثيق غير مكتملة");
}

const formData = new FormData();

formData.append("file",file);
formData.append("fileName",file.name);
formData.append("publicKey",IMAGEKIT_PUBLIC_KEY);
formData.append("signature",auth.signature);
formData.append("token",auth.token);
formData.append("expire",auth.expire);
formData.append("useUniqueFileName","true");

const response = await fetch(
"https://upload.imagekit.io/api/v1/files/upload",
{
method:"POST",
body:formData
}
);

const result = await response.json();

if(!response.ok || !result.url){
throw new Error(result.message || "فشل رفع الملف إلى ImageKit");
}

return result.url;
}

function chooseFile(inputId,callback){

const input = document.getElementById(inputId);

input.value = "";

input.onchange = async ()=>{

const file = input.files[0];

if(!file) return;

try{

alert("بدأ رفع الملف، يرجى الانتظار...");

const url = await uploadToImageKit(file);

await callback(url,file);

alert("تم رفع الملف بنجاح");

}catch(error){

console.error(error);

alert("حدث خطأ أثناء الرفع: " + error.message);

}
};

input.click();
}

/* ================= النظام القديم ================= */

let items = [];

let subject = document.getElementById("subject").value;

document.getElementById("subject").onchange = ()=>{
subject = document.getElementById("subject").value;
loadOld();
};

window.addTitle = ()=>{
items.push({type:"title",text:prompt("عنوان")});
render();
autoSave();
};

window.addText = ()=>{
items.push({type:"text",text:prompt("نص")});
render();
autoSave();
};

window.addImage = ()=>{
chooseFile("oldImageFile",async url=>{

items.push({
type:"image",
url:url
});

render();
await autoSave();

});
};

window.addBook = ()=>{
items.push({
type:"book",
name:prompt("اسم"),
url:prompt("رابط")
});
render();
autoSave();
};

window.addLink = ()=>{
items.push({
type:"link",
name:prompt("اسم"),
url:prompt("رابط")
});
render();
autoSave();
};

window.addAudio = ()=>{

let name = prompt("اسم الصوت");

if(!name) return;

chooseFile("oldAudioFile",async url=>{

items.push({
type:"audio",
name:name,
url:url
});

render();
await autoSave();

});

};

window.addVideo = ()=>{

let name = prompt("اسم الفيديو");

if(!name) return;

chooseFile("oldVideoFile",async url=>{

items.push({
type:"video",
name:name,
url:url
});

render();
await autoSave();

});

};

window.editItem = (i)=>{

let v = prompt(
"تعديل",
items[i].text || items[i].name || items[i].url
);

if(!v) return;

if(items[i].text) items[i].text=v;
if(items[i].name) items[i].name=v;
if(items[i].url) items[i].url=v;

render();
autoSave();
};

window.deleteItem = (i)=>{
items.splice(i,1);
render();
autoSave();
};

function render(){

preview.innerHTML = items.map((i,k)=>`
<div class="item">
${i.text || i.name || i.url || ""}
<div class="actions">
<button class="edit" onclick="editItem(${k})">تعديل</button>
<button class="delete" onclick="deleteItem(${k})">حذف</button>
</div>
</div>
`).join("");

}

async function loadOld(){

let d = await getDoc(doc(db,"subjects",subject));

items = d.exists() ? d.data().items || [] : [];

render();

}

async function autoSave(){

await setDoc(doc(db,"subjects",subject),{items});

}

window.saveOld = autoSave;

/* ================= الفصول ================= */

let subject2="aqida";

subject2 = document.getElementById("subject").value;
subject2 = "aqida";

document.getElementById("subject2").innerHTML =
document.getElementById("subject").innerHTML;

document.getElementById("subject2").onchange = e=>{
subject2=e.target.value;
loadChapters();
};

window.addChapter = async ()=>{

if(!chapterTitle.value) return;

await addDoc(collection(db,"chapters"),{
subject:subject2,
title:chapterTitle.value,
order:Date.now()
});

chapterTitle.value="";

loadChapters();

};

async function loadChapters(){

let q = query(
collection(db,"chapters"),
where("subject","==",subject2)
);

let snap = await getDocs(q);

chaptersList.innerHTML="";
chapterSelect.innerHTML="";

let arr=[];

snap.forEach(d=>arr.push({id:d.id,...d.data()}));

arr.sort((a,b)=>(a.order||0)-(b.order||0));

arr.forEach(data=>{

let id=data.id;

chaptersList.innerHTML+=`
<div class="item" data-id="${id}">
📂 ${data.title}
<div class="actions">
<button class="moveUp" onclick="moveChapterUp('${id}')">⬆</button>
<button class="moveDown" onclick="moveChapterDown('${id}')">⬇</button>
<button class="edit" onclick="editChapter('${id}','${data.title}')">تعديل</button>
<button class="delete" onclick="deleteChapter('${id}')">حذف</button>
</div>
</div>`;

chapterSelect.innerHTML+=`<option value="${id}">${data.title}</option>`;

});

loadLessons();

}

window.editChapter = async (id,title)=>{

let t=prompt("تعديل",title);

if(!t) return;

await updateDoc(doc(db,"chapters",id),{title:t});

loadChapters();

};

window.deleteChapter = async (id)=>{

await deleteDoc(doc(db,"chapters",id));

loadChapters();

};

/* ================= رفع ملفات الدروس ================= */

window.selectLessonImage = ()=>{
chooseFile("lessonImageFile",url=>{
document.getElementById("lessonImage").value=url;
});
};

window.selectLessonAudio = ()=>{
chooseFile("lessonAudioFile",url=>{
document.getElementById("lessonAudio").value=url;
});
};

window.selectLessonVideo = ()=>{
chooseFile("lessonVideoFile",url=>{
document.getElementById("lessonVideo").value=url;
});
};

/* ================= الدروس ================= */

window.addLesson = async ()=>{

await addDoc(collection(db,"lessons"),{

subject:subject2,
chapterId:chapterSelect.value,
title:lessonTitle.value,
text:lessonText.value,
image:lessonImage.value,
audio:lessonAudio.value,
video:lessonVideo.value,
link:lessonLink.value,
time:Date.now(),
order:Date.now()

});

loadLessons();

};

/* ================= تحميل الدروس ================= */

async function loadLessons(){

if(!chapterSelect.value) return;

let q=query(
collection(db,"lessons"),
where("chapterId","==",chapterSelect.value)
);

let snap=await getDocs(q);

lessonsList.innerHTML="";

let arr=[];

snap.forEach(d=>{

arr.push({
id:d.id,
...d.data()
});

});

arr.sort((a,b)=>(a.order||0)-(b.order||0));

arr.forEach(data=>{

let id=data.id;

const encoded = encodeURIComponent(JSON.stringify(data));

lessonsList.innerHTML+=`
<div class="item" data-id="${id}">
📖 ${data.title}
<div class="actions">

<button class="moveUp" onclick="moveLessonUp('${id}')">⬆</button>

<button class="moveDown" onclick="moveLessonDown('${id}')">⬇</button>

<button class="view" onclick="viewLesson('${encoded}')">عرض</button>

<button class="edit" onclick="editLesson('${id}','${encoded}')">تعديل</button>

<button class="delete" onclick="deleteLesson('${id}')">حذف</button>

</div>
</div>`;

});

}

/* ================= عرض الدرس ================= */

window.viewLesson = (dataStr)=>{

let data = JSON.parse(decodeURIComponent(dataStr));

document.getElementById("viewTitle").textContent =
data.title || "بدون عنوان";

document.getElementById("viewContent").textContent =
data.text || "لا يوجد نص";

document.getElementById("viewModal").style.display = "flex";

};

window.closeViewModal = ()=>{

document.getElementById("viewModal").style.display = "none";

};

/* ================= رفع ملفات التعديل ================= */

window.selectEditImage = ()=>{
chooseFile("editImageFile",url=>{
document.getElementById("editImage").value=url;
});
};

window.selectEditAudio = ()=>{
chooseFile("editAudioFile",url=>{
document.getElementById("editAudio").value=url;
});
};

window.selectEditVideo = ()=>{
chooseFile("editVideoFile",url=>{
document.getElementById("editVideo").value=url;
});
};

/* ================= تعديل الدرس ================= */

let currentEditId = null;

window.editLesson = (id, dataStr)=>{

let data = JSON.parse(decodeURIComponent(dataStr));

currentEditId = id;

document.getElementById("editTitle").value = data.title || "";

document.getElementById("editText").value = data.text || "";

document.getElementById("editImage").value = data.image || "";

document.getElementById("editAudio").value = data.audio || "";

document.getElementById("editVideo").value = data.video || "";

document.getElementById("editLink").value = data.link || "";

document.getElementById("editModal").style.display = "flex";

};

window.closeEditModal = ()=>{

document.getElementById("editModal").style.display = "none";

currentEditId = null;

};

window.saveEditLesson = async ()=>{

if(!currentEditId) return;

await updateDoc(doc(db,"lessons",currentEditId),{

title: document.getElementById("editTitle").value,

text: document.getElementById("editText").value,

image: document.getElementById("editImage").value,

audio: document.getElementById("editAudio").value,

video: document.getElementById("editVideo").value,

link: document.getElementById("editLink").value

});

closeEditModal();

loadLessons();

};

window.deleteLesson = async (id)=>{

await deleteDoc(doc(db,"lessons",id));

loadLessons();

};

/* ================= تحريك الدروس ================= */

async function swapLesson(id,direction){

let q=query(
collection(db,"lessons"),
where("chapterId","==",chapterSelect.value)
);

let snap=await getDocs(q);

let arr=[];

snap.forEach(d=>{

arr.push({
id:d.id,
...d.data()
});

});

arr.sort((a,b)=>(a.order||0)-(b.order||0));

let index=arr.findIndex(x=>x.id===id);

if(index===-1) return;

let target = direction==="up" ? index-1 : index+1;

if(target<0 || target>=arr.length) return;

let current=arr[index];

let other=arr[target];

let currentOrder=current.order || index;

let otherOrder=other.order || target;

await updateDoc(doc(db,"lessons",current.id),{
order:otherOrder
});

await updateDoc(doc(db,"lessons",other.id),{
order:currentOrder
});

loadLessons();

}

window.moveLessonUp=(id)=>swapLesson(id,"up");

window.moveLessonDown=(id)=>swapLesson(id,"down");

/* ================= تحريك الفصول ================= */

async function swapChapter(id,direction){

let q=query(
collection(db,"chapters"),
where("subject","==",subject2)
);

let snap=await getDocs(q);

let arr=[];

snap.forEach(d=>arr.push({id:d.id,...d.data()}));

arr.sort((a,b)=>(a.order||0)-(b.order||0));

let index=arr.findIndex(x=>x.id===id);

if(index===-1) return;

let target=direction==="up"?index-1:index+1;

if(target<0||target>=arr.length) return;

let current=arr[index];

let other=arr[target];

await updateDoc(doc(db,"chapters",current.id),{
order:other.order||target
});

await updateDoc(doc(db,"chapters",other.id),{
order:current.order||index
});

loadChapters();

}

window.moveChapterUp=(id)=>swapChapter(id,"up");

window.moveChapterDown=(id)=>swapChapter(id,"down");

chapterSelect.onchange=loadLessons;

loadOld();

loadChapters();

</script>

</body>
</html>
