<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Cairo,sans-serif}

body{
background:#06131f;
color:#fff;
min-height:100vh;
}

body:before{
content:"";
position:fixed;
inset:0;
z-index:-1;
background:
linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.85)),
url('https://a.top4top.io/p_38068co2c0.jpg');
background-size:cover;
background-position:center;
}

.header{
text-align:center;
padding:20px;
color:#f5e6b3;
font-size:24px;
font-weight:700;
}

.container{
width:95%;
max-width:900px;
margin:auto;
padding-bottom:120px;
}

.card{
background:rgba(5,15,30,.65);
border-radius:18px;
padding:16px;
margin-bottom:15px;
}

select,button,input,textarea{
width:100%;
padding:12px;
border:none;
border-radius:12px;
margin-top:10px;
font-family:Cairo;
}

button{
background:#d4af37;
color:#06131f;
font-weight:bold;
cursor:pointer;
}

.item{
background:#0d2033;
padding:10px;
margin-top:10px;
border-radius:12px;
}

.actions{
display:flex;
gap:8px;
margin-top:10px;
}

.actions button{flex:1}

.edit{background:#2563eb;color:#fff}
.delete{background:#b91c1c;color:#fff}
.view{background:#16a34a;color:#fff}

hr{margin:15px 0;border:1px solid rgba(255,255,255,.1)}
</style>
</head>

<body>

<div class="header">لوحة التحكم النهائية</div>

<div class="container">

<!-- النظام القديم -->
<div class="card">
<h3>📚 النظام القديم</h3>

<select id="subject">
<option value="aqida">العقيدة</option>
<option value="hadith">الحديث</option>
<option value="fiqh">الفقه</option>
<option value="usul">الأصول</option>
<option value="history">التاريخ</option>
<option value="dawah">الدعوة</option>
<option value="tajweed">التجويد</option>
<option value="literature">الأدب</option>
<option value="nahw">النحو</option>
<option value="computer">الحاسوب</option>
<option value="english">الإنجليزي</option>
<option value="tafsir">التفسير</option>
</select>

<button onclick="addTitle()">عنوان</button>
<button onclick="addText()">نص</button>
<button onclick="addImage()">صورة</button>
<button onclick="addBook()">كتاب</button>
<button onclick="addLink()">رابط</button>
<button onclick="addAudio()">صوت</button>

<div id="preview"></div>

<button onclick="saveOld()">حفظ</button>
</div>

<!-- الفصول -->
<div class="card">
<h3>📂 الفصول والدروس</h3>

<select id="subject2"></select>

<input id="chapterTitle" placeholder="اسم الفصل">
<button onclick="addChapter()">➕ إضافة فصل</button>

<div id="chaptersList"></div>

<hr>

<select id="chapterSelect"></select>

<input id="lessonTitle" placeholder="عنوان الدرس">
<textarea id="lessonText" placeholder="نص الدرس"></textarea>
<input id="lessonImage" placeholder="رابط صورة">
<input id="lessonAudio" placeholder="رابط صوت">
<input id="lessonLink" placeholder="رابط">

<button onclick="addLesson()">➕ إضافة درس</button>

<div id="lessonsList"></div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
getDocs,
query,
where,
deleteDoc,
doc,
updateDoc,
setDoc,
getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAVHnPVmRegwOQGTugDN7oltRqlSM-5_wA",
authDomain: "p-726bc.firebaseapp.com",
projectId: "p-726bc"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ================= النظام القديم ================= */
let items = [];
let subject = document.getElementById("subject").value;

document.getElementById("subject").onchange = ()=>{
subject = document.getElementById("subject").value;
loadOld();
};

window.addTitle = ()=>{items.push({type:"title",text:prompt("عنوان")});render();autoSave();}
window.addText = ()=>{items.push({type:"text",text:prompt("نص")});render();autoSave();}
window.addImage = ()=>{items.push({type:"image",url:prompt("رابط")});render();autoSave();}
window.addBook = ()=>{items.push({type:"book",name:prompt("اسم"),url:prompt("رابط")});render();autoSave();}
window.addLink = ()=>{items.push({type:"link",name:prompt("اسم"),url:prompt("رابط")});render();autoSave();}
window.addAudio = ()=>{items.push({type:"audio",name:prompt("اسم"),url:prompt("رابط")});render();autoSave();}

window.editItem = (i)=>{
let v = prompt("تعديل", items[i].text || items[i].name || items[i].url);
if(!v) return;

if(items[i].text) items[i].text=v;
if(items[i].name) items[i].name=v;
if(items[i].url) items[i].url=v;

render();
autoSave();
};

window.deleteItem = (i)=>{
items.splice(i,1);
render();
autoSave();
};

function render(){
preview.innerHTML = items.map((i,k)=>`
<div class="item">
${i.text || i.name || i.url}
<div class="actions">
<button class="edit" onclick="editItem(${k})">تعديل</button>
<button class="delete" onclick="deleteItem(${k})">حذف</button>
</div>
</div>
`).join("");
}

async function loadOld(){
let d = await getDoc(doc(db,"subjects",subject));
items = d.exists() ? d.data().items || [] : [];
render();
}

async function autoSave(){
await setDoc(doc(db,"subjects",subject),{items});
}

window.saveOld = autoSave;

/* ================= الفصول ================= */
let subject2="aqida";

subject2 = document.getElementById("subject").value;
subject2 = "aqida";

document.getElementById("subject2").innerHTML =
document.getElementById("subject").innerHTML;

document.getElementById("subject2").onchange = e=>{
subject2=e.target.value;
loadChapters();
};

window.addChapter = async ()=>{
if(!chapterTitle.value) return;

await addDoc(collection(db,"chapters"),{
subject:subject2,
title:chapterTitle.value
});

chapterTitle.value="";
loadChapters();
};

async function loadChapters(){

let q = query(collection(db,"chapters"),where("subject","==",subject2));
let snap = await getDocs(q);

chaptersList.innerHTML="";
chapterSelect.innerHTML="";

snap.forEach(d=>{
let id=d.id;
let data=d.data();

chaptersList.innerHTML+=`
<div class="item">
📂 ${data.title}
<div class="actions">
<button class="edit" onclick="editChapter('${id}','${data.title}')">تعديل</button>
<button class="delete" onclick="deleteChapter('${id}')">حذف</button>
</div>
</div>`;

chapterSelect.innerHTML+=`<option value="${id}">${data.title}</option>`;
});

loadLessons();
}

window.editChapter = async (id,title)=>{
let t=prompt("تعديل",title);
if(!t) return;
await updateDoc(doc(db,"chapters",id),{title:t});
loadChapters();
};

window.deleteChapter = async (id)=>{
await deleteDoc(doc(db,"chapters",id));
loadChapters();
};

/* ================= الدروس ================= */

window.addLesson = async ()=>{
await addDoc(collection(db,"lessons"),{
subject:subject2,
chapterId:chapterSelect.value,
title:lessonTitle.value,
text:lessonText.value,
image:lessonImage.value,
audio:lessonAudio.value,
link:lessonLink.value,
time:Date.now()
});

loadLessons();
};

async function loadLessons(){

if(!chapterSelect.value) return;

let q=query(collection(db,"lessons"),where("chapterId","==",chapterSelect.value));
let snap=await getDocs(q);

lessonsList.innerHTML="";

snap.forEach(d=>{
let id=d.id;
let data=d.data();

lessonsList.innerHTML+=`
<div class="item">
📖 ${data.title}
<div class="actions">
<button class="view" onclick="alert('${data.text || data.title}')">عرض</button>
<button class="edit" onclick="editLesson('${id}',${JSON.stringify(data)})">تعديل</button>
<button class="delete" onclick="deleteLesson('${id}')">حذف</button>
</div>
</div>`;
});
}

window.editLesson = async (id,data)=>{
let title = prompt("العنوان",data.title);
if(!title) return;

await updateDoc(doc(db,"lessons",id),{
...data,
title
});

loadLessons();
};

window.deleteLesson = async (id)=>{
await deleteDoc(doc(db,"lessons",id));
loadLessons();
};

chapterSelect.onchange=loadLessons;

loadOld();
loadChapters();

</script>

</body>
</html>
