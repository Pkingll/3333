<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>عرض المادة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Cairo,sans-serif
}

body{
background:#06131f;
color:#fff;
min-height:100vh;
overflow-x:hidden
}

body:before{
content:"";
position:fixed;
inset:0;
z-index:-1;
background:
linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.85)),
url('https://a.top4top.io/p_38068co2c0.jpg');
background-size:cover;
background-position:center;
}

.marquee{
overflow:hidden;
background:rgba(0,0,0,.45);
padding:12px 0
}

.marquee span{
display:inline-block;
white-space:nowrap;
padding-left:100%;
color:#f5e6b3;
font-weight:700;
animation:move 18s linear infinite;
}

@keyframes move{
0%{transform:translateX(0)}
100%{transform:translateX(-100%)}
}

.header{
text-align:center;
padding:25px 15px
}

.header h1{
color:#f5e6b3
}

.content{
width:92%;
max-width:900px;
margin:20px auto 100px;
background:rgba(5,15,30,.65);
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
padding:20px;
line-height:2;
}

.content img{
width:100%;
border-radius:12px;
margin:10px 0
}

.content a{
display:block;
margin:10px 0;
padding:12px;
background:#0d2033;
border-radius:10px;
color:#f5e6b3;
text-decoration:none;
}

.back{
position:fixed;
left:15px;
bottom:15px;
padding:14px 20px;
border:none;
border-radius:14px;
background:#d4af37;
color:#06131f;
font-weight:bold;
cursor:pointer;
}

.audio-box{
margin:15px 0;
padding:14px;
background:#0d2033;
border-radius:14px;
border:1px solid rgba(255,255,255,.08);
}

.audio-title{
color:#f5e6b3;
margin-bottom:10px;
font-weight:700;
}

.audio-box audio{
width:100%;
border-radius:10px;
}

/* ================== إضافة الفصول ================== */
.box{
width:92%;
max-width:900px;
margin:10px auto;
background:rgba(5,15,30,.65);
border:1px solid rgba(255,255,255,.1);
border-radius:15px;
padding:15px;
}

.itemBtn{
padding:10px;
margin:8px 0;
background:#0d2033;
border-radius:10px;
cursor:pointer;
color:#f5e6b3;
}

.lessonBtn{
padding:10px;
margin:8px 0;
background:#112233;
border-radius:10px;
cursor:pointer;
}

/* ================== إضافات البحث والاختبارات ================== */
.search-box{
width:92%;
max-width:900px;
margin:15px auto;
}

.search-box input{
width:100%;
padding:14px;
border:1px solid rgba(255,255,255,.2);
border-radius:12px;
background:#0d2033;
color:#fff;
font-size:16px;
outline:none;
}

.search-box input::placeholder{
color:#aaa;
}

.nav-btns{
width:92%;
max-width:900px;
margin:15px auto;
display:flex;
gap:10px;
flex-wrap:wrap;
}

.nav-btn{
padding:12px 20px;
border:none;
border-radius:12px;
background:#0d2033;
color:#f5e6b3;
font-weight:700;
cursor:pointer;
border:1px solid rgba(255,255,255,.1);
}

.nav-btn:hover{
background:#1a3a5c;
}

.nav-btn.active{
background:#d4af37;
color:#06131f;
}

.modal-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
z-index:1000;
display:none;
justify-content:center;
align-items:center;
padding:20px;
}

.modal-overlay.show{
display:flex;
}

.modal{
background:#0d2033;
border:1px solid rgba(255,255,255,.15);
border-radius:20px;
width:100%;
max-width:600px;
max-height:90vh;
overflow-y:auto;
padding:25px;
position:relative;
}

.modal h2{
color:#f5e6b3;
margin-bottom:20px;
text-align:center;
}

.modal input, .modal select{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid rgba(255,255,255,.2);
border-radius:10px;
background:#06131f;
color:#fff;
font-size:16px;
outline:none;
}

.modal label{
display:block;
color:#f5e6b3;
margin:10px 0 5px;
}

.close-modal{
position:absolute;
top:15px;
left:15px;
background:#c0392b;
color:#fff;
border:none;
padding:8px 14px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.question-box{
background:#06131f;
border:1px solid rgba(255,255,255,.1);
border-radius:14px;
padding:20px;
margin:15px 0;
}

.question-box h4{
color:#f5e6b3;
margin-bottom:15px;
}

.question-text{
margin-bottom:15px;
color:#fff;
line-height:1.8;
font-size:16px;
}

.choices{
display:flex;
flex-direction:column;
gap:10px;
}

.choice{
padding:14px;
background:#0d2033;
border:1px solid rgba(255,255,255,.1);
border-radius:10px;
cursor:pointer;
transition:.3s;
text-align:right;
font-size:15px;
}

.choice:hover{
background:#1a3a5c;
}

.choice.selected{
background:#d4af37;
color:#06131f;
border-color:#d4af37;
}

.choice.wrong{
background:#c0392b;
border-color:#c0392b;
}

.choice.correct{
background:#27ae60;
border-color:#27ae60;
}

.result-box{
text-align:center;
padding:30px;
}

.result-score{
font-size:48px;
color:#f5e6b3;
font-weight:700;
}

.result-percent{
font-size:24px;
color:#27ae60;
margin:10px 0;
}

.participants-box{
width:92%;
max-width:900px;
margin:20px auto;
background:rgba(5,15,30,.65);
border:1px solid rgba(255,255,255,.1);
border-radius:15px;
padding:20px;
}

.participants-box h3{
color:#f5e6b3;
margin-bottom:15px;
}

.participant-item{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
margin:8px 0;
background:#0d2033;
border-radius:10px;
flex-wrap:wrap;
gap:10px;
}

.participant-info{
flex:1;
}

.participant-name{
color:#f5e6b3;
font-weight:700;
}

.participant-chapters{
color:#aaa;
font-size:14px;
}

.participant-score{
font-size:20px;
font-weight:700;
color:#27ae60;
}

.participant-actions{
display:flex;
gap:8px;
}

.participant-actions button{
padding:6px 12px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:14px;
}

.share-btn{
background:#25d366;
color:#fff;
}

.delete-btn{
background:#c0392b;
color:#fff;
}

.toast{
position:fixed;
top:20px;
right:20px;
background:#27ae60;
color:#fff;
padding:15px 25px;
border-radius:12px;
z-index:2000;
transform:translateX(150%);
transition:.5s;
font-weight:700;
}

.toast.show{
transform:translateX(0);
}

.empty-state{
text-align:center;
padding:40px;
color:#aaa;
}

.btn-primary{
background:#d4af37;
color:#06131f;
border:none;
padding:12px 24px;
border-radius:12px;
font-weight:700;
cursor:pointer;
font-size:16px;
}

.btn-secondary{
background:#0d2033;
color:#f5e6b3;
border:1px solid rgba(255,255,255,.1);
padding:10px 20px;
border-radius:10px;
cursor:pointer;
}

.timer{
text-align:center;
font-size:20px;
color:#e74c3c;
font-weight:700;
margin:10px 0;
}

.back-btn{
display:block;
margin:15px auto;
padding:12px 24px;
background:#0d2033;
color:#f5e6b3;
border:1px solid rgba(255,255,255,.1);
border-radius:12px;
cursor:pointer;
font-weight:700;
text-align:center;
width:92%;
max-width:900px;
}

.back-btn:hover{
background:#1a3a5c;
}

::-webkit-scrollbar{
width:8px;
}

::-webkit-scrollbar-track{
background:#06131f;
}

::-webkit-scrollbar-thumb{
background:#d4af37;
border-radius:4px;
}

@media(max-width:600px){
.participant-item{
flex-direction:column;
align-items:flex-start;
}
.participant-actions{
width:100%;
justify-content:flex-end;
}
}
</style>

</head>
<body>

<div class="marquee">
<span>
من يرد الله به خيراً يفقهه في الدين •
من يرد الله به خيراً يفقهه في الدين •
من يرد الله به خيراً يفقهه في الدين
</span>
</div>

<div class="header">
<h1 id="title">المادة</h1>
</div>

<!-- أزرار التنقل -->
<div class="nav-btns">
<button class="nav-btn" onclick="openExamSection()">✏️ الاختبارات</button>
<button class="nav-btn" onclick="openParticipantsSection()">🏆 مشاركات في الاختبارات</button>
</div>

<!-- البحث -->
<div class="search-box">
<input type="text" id="searchInput" placeholder="🔍 ابحث عن فصل أو درس..." oninput="performSearch()">
</div>

<!-- القسم الرئيسي: الفصول + الدروس + المحتوى -->
<div id="section-main">
<!-- 📂 الفصول -->
<div class="box">
<h3 style="color:#f5e6b3">📂 الفصول</h3>
<div id="chaptersList"></div>
</div>

<!-- 📖 الدروس -->
<div class="box" id="lessonsBox" style="display:none">
<h3 style="color:#f5e6b3">📖 الدروس</h3>
<div id="lessonsList"></div>
</div>

<!-- المحتوى القديم بدون تغيير -->
<div class="content" id="content"></div>
</div>

<!-- قسم الاختبارات -->
<div id="section-exam" style="display:none">
<button class="back-btn" onclick="backToMain()">⬅ العودة للمحتوى</button>

<div class="box">
<h3 style="color:#f5e6b3">✏️ إنشاء اختبار جديد</h3>
<p style="color:#aaa;margin-bottom:15px">يمكنك إنشاء اختبار لـ <strong>أي مادة</strong> تختارها من القائمة:</p>

<div style="margin:15px 0">
<label style="color:#f5e6b3;display:block;margin-bottom:5px">👤 اسم المشارك:</label>
<input type="text" id="examParticipantName" placeholder="أدخل اسمك" style="width:100%;padding:12px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:#06131f;color:#fff;outline:none">
</div>

<div style="margin:15px 0">
<label style="color:#f5e6b3;display:block;margin-bottom:5px">📚 اختر المادة:</label>
<select id="examSubjectSelect" onchange="loadExamChapters()" style="width:100%;padding:12px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:#06131f;color:#fff;outline:none">
<option value="">-- اختر المادة --</option>
</select>
</div>

<div style="margin:15px 0">
<label style="color:#f5e6b3;display:block;margin-bottom:5px">📂 الفصول المطلوبة (Ctrl+Click للاختيار المتعدد):</label>
<select id="examChaptersSelect" multiple style="width:100%;padding:12px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:#06131f;color:#fff;outline:none;min-height:120px">
<option value="">اختر المادة أولاً</option>
</select>
</div>

<div style="margin:15px 0">
<label style="color:#f5e6b3;display:block;margin-bottom:5px">🔢 عدد الأسئلة:</label>
<select id="examQuestionCount" style="width:100%;padding:12px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:#06131f;color:#fff;outline:none">
<option value="5">5 أسئلة</option>
<option value="10" selected>10 أسئلة</option>
<option value="15">15 سؤالاً</option>
<option value="20">20 سؤالاً</option>
</select>
</div>

<div style="margin:15px 0">
<label style="color:#f5e6b3;display:block;margin-bottom:5px">⏱️ مدة الاختبار (دقيقة):</label>
<select id="examDuration" style="width:100%;padding:12px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:#06131f;color:#fff;outline:none">
<option value="5">5 دقائق</option>
<option value="10">10 دقائق</option>
<option value="15" selected>15 دقيقة</option>
<option value="30">30 دقيقة</option>
<option value="60">60 دقيقة</option>
</select>
</div>

<button class="btn-primary" onclick="window.startExam()" style="width:100%;margin-top:15px">
🚀 بدء الاختبار
</button>
</div>
</div>

<!-- قسم المشاركين -->
<div id="section-participants" style="display:none">
<button class="back-btn" onclick="backToMain()">⬅ العودة للمحتوى</button>

<div class="participants-box">
<h3>🏆 قائمة المشاركين في الاختبارات</h3>
<div id="participantsList"></div>
</div>
</div>

<!-- نافذة الاختبار -->
<div class="modal-overlay" id="examModal">
<div class="modal">
<button class="close-modal" onclick="closeExamModal()">✕</button>
<h2>📝 الاختبار</h2>
<div class="timer" id="examTimer">⏱️ 15:00</div>
<div id="examContent"></div>
</div>
</div>

<!-- نافذة النتيجة -->
<div class="modal-overlay" id="resultModal">
<div class="modal">
<div id="resultContent"></div>
</div>
</div>

<button class="back" onclick="location.href='index.html'">
⬅ الرجوع
</button>

<!-- إشعار -->
<div class="toast" id="toast"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
getDoc,
collection,
query,
where,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyAVHnPVmRegwOQGTugDN7oltRqlSM-5_wA",
 authDomain: "p-726bc.firebaseapp.com",
 projectId: "p-726bc",
 storageBucket: "p-726bc.firebasestorage.app",
 messagingSenderId: "752913389065",
 appId: "1:752913389065:web:20cf8c03fe4ace03650ad8"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
const id = params.get("id");

/* ================= اسم المادة ================= */
const names = {
aqida:"العقيدة",
hadith:"الحديث",
fiqh:"الفقه",
usul:"أصول الفقه",
history:"تاريخ الخلفاء الراشدين",
dawah:"منهج الدعوة",
tajweed:"أحكام وتجويد القرآن",
literature:"الدراسات الأدبية",
nahw:"النحو والصرف",
computer:"الحاسوب",
english:"الإنجليزي",
tafsir:"التفسير"
};

document.getElementById("title").textContent =
names[id] || "المادة";

/* ================= المحتوى القديم ================= */
const snap = await getDoc(doc(db,"subjects",id));

const content = document.getElementById("content");

if(snap.exists()){
 const data = snap.data();

 (data.items || []).forEach(item=>{

 if(item.type==="title"){
 content.innerHTML += `<h2>${item.text}</h2>`;
 }

 if(item.type==="text"){
 content.innerHTML += `<p>${item.text}</p>`;
 }

 if(item.type==="image"){
 content.innerHTML += `<img src="${item.url}">`;
 }

 if(item.type==="book"){
 content.innerHTML += `<a href="${item.url}" target="_blank">📚 ${item.name}</a>`;
 }

 if(item.type==="link"){
 content.innerHTML += `<a href="${item.url}" target="_blank">🔗 ${item.name}</a>`;
 }

 if(item.type==="audio"){
 content.innerHTML += `
 <div class="audio-box">
 <div class="audio-title">🎧 ${item.name}</div>
 <audio controls src="${item.url}"></audio>
 </div>`;
 }

 });
}


try{
const qLatest = query(collection(db,"lessons"),where("subject","==",id));
const sLatest = await getDocs(qLatest);
let latestTime = 0;
sLatest.forEach(d=>{
 const t=d.data().time || 0;
 if(t>latestTime) latestTime=t;
});
localStorage.setItem("seenTime_"+id, latestTime);
}catch(e){console.log(e);}

/* ================= الفصول + الدروس ================= */

let chaptersList = document.getElementById("chaptersList");
let lessonsList = document.getElementById("lessonsList");

async function loadChapters(){

const q = query(
collection(db,"chapters"),
where("subject","==",id)
);

const snap = await getDocs(q);

chaptersList.innerHTML = "";

let arr=[];
snap.forEach(docu=>{
const data = docu.data();
// استبعاد فصول الأسئلة (التي اسمها يبدأ بـ "أسئلة" أو "اسئلة")
if (data.title && !data.title.startsWith('أسئلة') && !data.title.startsWith('اسئلة')) {
arr.push({id:docu.id,...data});
}
});

arr.sort((a,b)=>(a.order||0)-(b.order||0));

arr.forEach(data=>{
const chapterId = data.id;

chaptersList.innerHTML += `
<div class="itemBtn" onclick="openChapter('${chapterId}')">
📂 ${data.title}
</div>`;
});
}

window.openChapter = async (chapterId)=>{

document.getElementById("lessonsBox").style.display="block";

const q = query(
collection(db,"lessons"),
where("chapterId","==",chapterId)
);

const snap = await getDocs(q);

lessonsList.innerHTML = "";

let arr=[];
snap.forEach(docu=>{
arr.push(docu.data());
});

arr.sort((a,b)=>(a.order||0)-(b.order||0));

arr.forEach(data=>{

lessonsList.innerHTML += `
<div class="lessonBtn" onclick='openLesson(${JSON.stringify(data)})'>
📖 ${data.title}
</div>`;
});
};

/* فتح درس داخل نفس الصفحة */
window.openLesson = (d)=>{

content.innerHTML = `
<h2 style="color:#f5e6b3">${d.title}</h2>
<p>${d.text || ""}</p>

${d.image ? `<img src="${d.image}">` : ""}

${d.audio ? `
<div class="audio-box">
<div class="audio-title">🎧 ${d.title}</div>
<audio controls src="${d.audio}"></audio>
</div>` : ""}

${d.link ? `<a href="${d.link}" target="_blank">🔗 ${d.link}</a>` : ""}
`;
};

/* ================= البحث ================= */
window.performSearch = function() {
const query = document.getElementById('searchInput').value.trim().toLowerCase();
if (!query) {
document.querySelectorAll('.itemBtn, .lessonBtn').forEach(el => {
el.style.display = 'block';
});
return;
}

document.querySelectorAll('.itemBtn').forEach(el => {
const text = el.textContent.toLowerCase();
el.style.display = text.includes(query) ? 'block' : 'none';
});

document.querySelectorAll('.lessonBtn').forEach(el => {
const text = el.textContent.toLowerCase();
el.style.display = text.includes(query) ? 'block' : 'none';
});

document.getElementById('lessonsBox').style.display = 'block';
};

/* ================= التنقل بين الأقسام ================= */
window.openExamSection = function() {
document.getElementById('section-main').style.display = 'none';
document.getElementById('section-participants').style.display = 'none';
document.getElementById('section-exam').style.display = 'block';
document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
event.target.classList.add('active');
loadSubjectsForExam();
};

window.openParticipantsSection = function() {
document.getElementById('section-main').style.display = 'none';
document.getElementById('section-exam').style.display = 'none';
document.getElementById('section-participants').style.display = 'block';
document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
event.target.classList.add('active');
loadParticipants();
};

window.backToMain = function() {
document.getElementById('section-main').style.display = 'block';
document.getElementById('section-exam').style.display = 'none';
document.getElementById('section-participants').style.display = 'none';
document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
};

/* ================= إنشاء الاختبار ================= */
let examQuestions = [];
let currentExam = {};
let examTimerInterval;

async function loadSubjectsForExam() {
const select = document.getElementById('examSubjectSelect');
select.innerHTML = '<option value="">-- اختر المادة --</option>';
for (const [key, name] of Object.entries(names)) {
select.innerHTML += `<option value="${key}">${name}</option>`;
}
if (id && names[id]) {
select.value = id;
loadExamChapters();
}
}

window.loadExamChapters = async function() {
const subject = document.getElementById('examSubjectSelect').value;
const select = document.getElementById('examChaptersSelect');
select.innerHTML = '';

if (!subject) {
select.innerHTML = '<option value="">اختر المادة أولاً</option>';
return;
}

const q = query(collection(db, 'chapters'), where('subject', '==', subject));
const snap = await getDocs(q);
let arr = [];
snap.forEach(docu => {
const data = docu.data();
// فقط فصول الأسئلة (التي اسمها يبدأ بـ "أسئلة" أو "اسئلة")
if (data.title && (data.title.startsWith('أسئلة') || data.title.startsWith('اسئلة'))) {
arr.push({id: docu.id, ...data});
}
});
arr.sort((a, b) => (a.order || 0) - (b.order || 0));

if (arr.length === 0) {
select.innerHTML = '<option value="">لا توجد فصول أسئلة في هذه المادة</option>';
return;
}

arr.forEach(ch => {
select.innerHTML += `<option value="${ch.id}">❓ ${ch.title}</option>`;
});
};

/* ================= نظام توليد أسئلة سليم من النص ================= */

function generateQuestions(lessons, count) {
console.log('توليد', count, 'سؤال من', lessons.length, 'درس');
let questions = [];
const shuffled = [...lessons].sort(() => Math.random() - 0.5);

for (const lesson of shuffled) {
if (questions.length >= count) break;

// المحاولة 1: استخراج السؤال من title و text (لفصول الأسئلة)
if (lesson.title && lesson.text) {
const extractedQ = extractQuestionFromLesson(lesson);
if (extractedQ) {
questions.push(extractedQ);
continue;
}
}

// المحاولة 2: الأسئلة المخصصة من Firebase (حقل questions)
if (lesson.questions && Array.isArray(lesson.questions) && lesson.questions.length > 0) {
const customQuestions = getValidCustomQuestions(lesson.questions);
for (const cq of customQuestions) {
if (questions.length >= count) break;
questions.push({
question: cq.question,
choices: [...cq.choices].sort(() => Math.random() - 0.5),
correct: cq.correct,
source: lesson.title
});
}
}

// المحاولة 3: التوليد التلقائي من النص الطويل (للدروس العادية)
if (questions.length < count && lesson.text && lesson.text.length > 100) {
const autoQ = createSmartQuestion(lesson);
if (autoQ) {
questions.push(autoQ);
}
}
}

return questions.slice(0, count);
}


/* ================= استخراج سؤال من درس فصول الأسئلة ================= */

function extractQuestionFromLesson(lesson) {
const title = (lesson.title || '').trim();
const text = (lesson.text || '').trim();
const type = lesson.type || 'mcq'; // افتراضي: اختياري

if (!title || !text) return null;

// سؤال مقالي (مفتوح)
if (type === 'open') {
return {
question: title,
correct: text,
isOpenEnded: true,
source: lesson.title
};
}

// سؤال اختياري (متعدد) - الخيارات مفصولة بـ |
const choices = text.split('|').map(c => c.trim()).filter(c => c.length > 0);
if (choices.length < 2) return null;

// الإجابة الصحيحة = الخيار الأول
const correctAnswer = choices[0];
const otherChoices = choices.slice(1);

// خلط الخيارات
const allChoices = [correctAnswer, ...otherChoices];
const shuffled = allChoices.sort(() => Math.random() - 0.5);

return {
question: title,
choices: shuffled,
correct: correctAnswer,
isOpenEnded: false,
source: lesson.title
};
}

/* ================= التحقق من الأسئلة المخصصة ================= */

function getValidCustomQuestions(questionsArray) {
const valid = [];
console.log('التحقق من الأسئلة:', questionsArray);
for (const q of questionsArray) {
// التأكد من أن q كائن وليس null
if (!q || typeof q !== 'object') continue;
// التعامل مع كائنات Firestore
const questionObj = q.toJSON ? q.toJSON() : q;
console.log('سؤال:', questionObj);
if (!questionObj.question || !questionObj.choices || !questionObj.correct) continue;
// التأكد من أن choices مصفوفة
let choices = questionObj.choices;
if (choices && typeof choices === 'object' && !Array.isArray(choices)) {
choices = Object.values(choices);
}
if (!Array.isArray(choices) || choices.length < 2) continue;
// التأكد من أن correct موجود في choices
const correctStr = String(questionObj.correct).trim();
const choicesStr = choices.map(c => String(c).trim());
if (!choicesStr.includes(correctStr)) continue;
valid.push({
question: String(questionObj.question).trim(),
choices: choicesStr,
correct: correctStr
});
}
console.log('أسئلة صالحة:', valid.length);
return valid;
}

/* ================= توليد سؤال ذكي من النص ================= */

function createSmartQuestion(lesson) {
const text = lesson.text || '';
const title = lesson.title || '';

// تقسيم النص إلى جمل كاملة
const sentences = text.split(/[.!؟]+/)
.map(s => s.trim())
.filter(s => s.length > 30 && s.length < 200);

if (sentences.length === 0) return null;

// اختيار جملة ذات معنى واضح
const sentence = sentences[Math.floor(Math.random() * sentences.length)];
console.log('الجملة المختارة:', sentence.substring(0, 80));

// استخراج المعلومة من الجملة
const info = extractClearInfo(sentence);
if (!info) return null;

console.log('المعلومة:', info);

// بناء السؤال والإجابة
return buildQuestion(info, sentence, text, title);
}

/* ================= استخراج معلومة واضحة من الجملة ================= */

function extractClearInfo(sentence) {
// نمط 1: "الشيء هو التعريف"
const defMatch = sentence.match(/(.{5,40}?)\s+(?:هو|هي)\s+(.{15,120})/);
if (defMatch) {
const term = defMatch[1].trim();
const definition = defMatch[2].trim();
// التحقق من أن التعريف واضح وليس كلمة واحدة
const defWords = definition.split(/\s+/).filter(w => w.length > 0);
if (defWords.length >= 3 && term.length > 3) {
return {
type: 'definition',
term: cleanText(term),
answer: cleanText(definition),
fullSentence: sentence
};
}
}

// نمط 2: "يفعل الشيء لأن السبب"
const reasonMatch = sentence.match(/(.{10,60}?)\s+(?:لأن|لِ)\s+(.{15,120})/);
if (reasonMatch) {
const action = reasonMatch[1].trim();
const reason = reasonMatch[2].trim();
const reasonWords = reason.split(/\s+/).filter(w => w.length > 0);
if (reasonWords.length >= 3 && action.length > 5) {
return {
type: 'reason',
term: cleanText(action),
answer: cleanText(reason),
fullSentence: sentence
};
}
}

// نمط 3: "الشيء يتكون من/يشمل"
const partsMatch = sentence.match(/(.{5,40}?)\s+(?:يتكون من|يشمل|يحتوي على|فيه|فيهما)\s+(.{15,120})/);
if (partsMatch) {
const term = partsMatch[1].trim();
const parts = partsMatch[2].trim();
const partsWords = parts.split(/\s+/).filter(w => w.length > 0);
if (partsWords.length >= 3 && term.length > 3) {
return {
type: 'parts',
term: cleanText(term),
answer: cleanText(parts),
fullSentence: sentence
};
}
}

// نمط 4: "إذا الشرط فالنتيجة"
const conditionMatch = sentence.match(/(?:إذا|من|كل من)\s+(.{10,60}?)\s+(?:فـ|فإن|فعليه|يجب عليه)\s+(.{15,120})/);
if (conditionMatch) {
const condition = conditionMatch[1].trim();
const result = conditionMatch[2].trim();
const resultWords = result.split(/\s+/).filter(w => w.length > 0);
if (resultWords.length >= 3 && condition.length > 5) {
return {
type: 'condition',
term: cleanText(condition),
answer: cleanText(result),
fullSentence: sentence
};
}
}

// نمط 5: "الشيء يكون في/عند/بعد"
const timeMatch = sentence.match(/(.{5,40}?)\s+(?:يكون|يكون|يقع|يحدث)\s+(?:في|عند|بعد|قبل|عندما|إذا)\s+(.{15,120})/);
if (timeMatch) {
const term = timeMatch[1].trim();
const time = timeMatch[2].trim();
const timeWords = time.split(/\s+/).filter(w => w.length > 0);
if (timeWords.length >= 3 && term.length > 3) {
return {
type: 'time',
term: cleanText(term),
answer: cleanText(time),
fullSentence: sentence
};
}
}

return null;
}

/* ================= بناء السؤال والإجابة ================= */

function buildQuestion(info, sentence, fullText, lessonTitle) {
const { type, term, answer } = info;

let questionText;

switch(type) {
case 'definition':
questionText = `ما هو تعريف "${term}"؟`;
break;
case 'reason':
questionText = `لماذا ${term}؟`;
break;
case 'parts':
questionText = `ما هي أجزاء/محتوى "${term}"؟`;
break;
case 'condition':
questionText = `ما هو الشيء الواجب عند ${term}؟`;
break;
case 'time':
questionText = `متى/أين يكون ${term}؟`;
break;
default:
questionText = `ما المقصود بـ "${term}" في الدرس؟`;
}

// توليد خيارات خاطئة من نفس الدرس
const wrongAnswers = generateWrongAnswersFromText(fullText, sentence, answer);

// دمج الإجابات
const allAnswers = [answer, ...wrongAnswers];
const uniqueAnswers = [...new Set(allAnswers)].filter(a => a !== answer);

if (uniqueAnswers.length < 2) {
console.log('خيارات غير كافية');
return null;
}

const choices = [answer, ...uniqueAnswers.slice(0, 3)];
const shuffled = choices.sort(() => Math.random() - 0.5);

return {
question: questionText,
choices: shuffled,
correct: answer,
source: lessonTitle
};
}

/* ================= توليد إجابات خاطئة من نفس الدرس ================= */

function generateWrongAnswersFromText(fullText, correctSentence, correctAnswer) {
const wrongAnswers = [];
const allSentences = fullText.split(/[.!؟]+/)
.map(s => s.trim())
.filter(s => s.length > 30 && s !== correctSentence);

// استخراج معلومات من جمل أخرى
for (const sentence of allSentences) {
const info = extractClearInfo(sentence);
if (info && info.answer !== correctAnswer && info.answer.length > 10) {
wrongAnswers.push(info.answer);
}
if (wrongAnswers.length >= 6) break;
}

// إذا لم تكفِ، استخدام أجزاء من جمل أخرى
if (wrongAnswers.length < 3) {
for (const sentence of allSentences) {
const clean = cleanText(sentence);
if (clean.length > 15 && clean !== correctAnswer && !wrongAnswers.includes(clean)) {
wrongAnswers.push(clean.substring(0, 80));
}
if (wrongAnswers.length >= 6) break;
}
}

return wrongAnswers.slice(0, 3);
}

/* ================= تنظيف النصوص ================= */

function cleanText(text) {
return text
.replace(/[،,؛;:.!؟"']/g, '')
.replace(/\s+/g, ' ')
.trim()
.substring(0, 100);
}

function startTimer(seconds) {
const timerEl = document.getElementById('examTimer');
let remaining = seconds;

examTimerInterval = setInterval(() => {
remaining--;
const mins = Math.floor(remaining / 60);
const secs = remaining % 60;
timerEl.textContent = `⏱️ ${mins}:${secs.toString().padStart(2, '0')}`;

if (remaining <= 0) {
clearInterval(examTimerInterval);
submitExam();
showToast('⏰ انتهى وقت الاختبار!');
}
}, 1000);
}

window.closeExamModal = function() {
clearInterval(examTimerInterval);
document.getElementById('examModal').classList.remove('show');
};

window.submitExam = function() {
clearInterval(examTimerInterval);

let correctMCQ = 0;
let mcqTotal = 0;
let openTotal = 0;
let openScoreSum = 0;

examQuestions.forEach((q, i) => {
if (q.isOpenEnded) {
// سؤال مقالي
const userAnswer = document.getElementById(`answer-${i}`).value.trim();
q.userAnswer = userAnswer;

const score = calculateOpenScore(userAnswer, q.correct);
q.score = score;
openScoreSum += score;
openTotal++;

// تلوين الحقل
const textarea = document.getElementById(`answer-${i}`);
if (score >= 70) {
textarea.style.borderColor = '#27ae60';
textarea.style.background = 'rgba(39,174,96,0.1)';
} else if (score >= 40) {
textarea.style.borderColor = '#d4af37';
textarea.style.background = 'rgba(212,175,55,0.1)';
} else {
textarea.style.borderColor = '#c0392b';
textarea.style.background = 'rgba(192,57,43,0.1)';
}
} else {
// سؤال اختياري
mcqTotal++;
const box = document.getElementById(`choices-${i}`);
if (!box) return;

box.querySelectorAll('.choice').forEach(c => {
if (c.textContent === q.correct) c.classList.add('correct');
if (c.textContent === q.userAnswer && q.userAnswer !== q.correct) c.classList.add('wrong');
});

if (q.userAnswer === q.correct) correctMCQ++;
}
});

// حساب النتيجة النهائية
const mcqPercent = mcqTotal > 0 ? Math.round((correctMCQ / mcqTotal) * 100) : 100;
const openPercent = openTotal > 0 ? Math.round(openScoreSum / openTotal) : 100;

// الوزن: 50% اختياري + 50% مقالي (إذا وجد النوعان)
let finalPercent;
if (mcqTotal > 0 && openTotal > 0) {
finalPercent = Math.round((mcqPercent + openPercent) / 2);
} else if (mcqTotal > 0) {
finalPercent = mcqPercent;
} else {
finalPercent = openPercent;
}

const totalQuestions = examQuestions.length;
const totalCorrect = correctMCQ + Math.round((openScoreSum / 100) * openTotal);

const result = {
id: Date.now(),
name: currentExam.name,
subject: currentExam.subject,
subjectKey: currentExam.subjectKey,
chapters: currentExam.chapters,
score: totalCorrect,
total: totalQuestions,
percent: finalPercent,
mcqScore: correctMCQ,
mcqTotal: mcqTotal,
openScore: openTotal > 0 ? Math.round(openScoreSum / openTotal) : 0,
openTotal: openTotal,
date: new Date().toLocaleString('ar-SA')
};

saveResult(result);
document.getElementById('examModal').classList.remove('show');
showResult(result);
};

/* ================= تصحيح الأسئلة المقالية ================= */

function calculateOpenScore(userAnswer, modelAnswer) {
if (!userAnswer || userAnswer.length < 5) return 0;

const modelPoints = modelAnswer.split('
')
.map(l => l.trim())
.filter(l => l.length > 5);

const userText = userAnswer.toLowerCase();
let matched = 0;
const totalPoints = modelPoints.length || 1;

modelPoints.forEach(point => {
// استخراج الكلمات المفتاحية (أكثر من 3 حروف)
const keywords = point.split(/\s+/)
.filter(w => w.length > 3)
.map(w => w.replace(/[،,؛;:.!؟"']/g, '').toLowerCase());

// يكفي وجود نصف الكلمات المفتاحية
let keywordMatches = 0;
keywords.forEach(kw => {
if (userText.includes(kw)) keywordMatches++;
});

const matchRatio = keywords.length > 0 ? keywordMatches / keywords.length : 0;
if (matchRatio >= 0.4) matched++;
});

return Math.round((matched / totalPoints) * 100);
}

// بناء تفاصيل الأسئلة المقالية

openReview = `

${result.mcqTotal > 0 ? `<p style="color:#27ae60;margin:10px 0">✅ اختياري: ${result.mcqScore}/${result.mcqTotal}</p>` : ''}
${result.openTotal > 0 ? `<p style="color:#d4af37;margin:10px 0">📝 مقالي: ${result.openScore}%</p>` : ''}

<p style="color:#aaa;margin:15px 0">المادة: ${result.subject}</p>

details = `<div style="color:#aaa;font-size:13px">✅ اختياري: ${r.mcqScore}/${r.mcqTotal}</div>`;
} else if (r.openTotal > 0) {
details = `<div style="color:#aaa;font-size:13px">📝 مقالي: ${r.openScore}%</div>`;
}

container.innerHTML += `
<div class="participant-item">
<div class="participant-info">
<div class="participant-name">👤 ${r.name}</div>
<div class="participant-chapters">📚 ${r.subject} | 📂 ${r.chapters.join(' • ')}</div>
${details}
<div class="participant-chapters">📅 ${r.date}</div>
</div>
<div class="participant-score">${r.score}/${r.total} (${r.percent}%)</div>
<div class="participant-actions">
<button class="share-btn" onclick="shareResult(${r.id})">📤 واتساب</button>
<button class="delete-btn" onclick="deleteResult(${r.id})">🗑️ حذف</button>
</div>
</div>
`;
});
};

window.deleteResult = function(resultId) {
if (!confirm('هل أنت متأكد من حذف هذه النتيجة؟')) return;

let results = JSON.parse(localStorage.getItem('examResults') || '[]');
results = results.filter(r => r.id !== resultId);
localStorage.setItem('examResults', JSON.stringify(results));
loadParticipants();
showToast('🗑️ تم حذف النتيجة');
};

window.shareResult = function(resultId) {
let results = JSON.parse(localStorage.getItem('examResults') || '[]');
const result = results.find(r => r.id === resultId);
if (!result) return;

let details = '';
if (result.mcqTotal > 0) {
details += `✅ اختياري: ${result.mcqScore}/${result.mcqTotal}
`;
}
if (result.openTotal > 0) {
details += `📝 مقالي: ${result.openScore}%
`;
}

const text = `🎓 نتيجة الاختبار
👤 الاسم: ${result.name}
📚 المادة: ${result.subject}
📂 الفصول: ${result.chapters.join(' • ')}
${details}✅ النتيجة: ${result.score}/${result.total}
📊 النسبة: ${result.percent}%
📅 التاريخ: ${result.date}

🌟 تم الاختبار عبر تطبيق التعليم`;

const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
window.open(url, '_blank');
};

/* ================= إشعارات ================= */
window.showToast = function(message) {
const toast = document.getElementById('toast');
toast.textContent = message;
toast.classList.add('show');
setTimeout(() => toast.classList.remove('show'), 3000);
};

/* تشغيل */
loadChapters();

</script>

</body>
</html>
