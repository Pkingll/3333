<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>عرض المادة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Cairo,sans-serif
}

body{
background:#06131f;
color:#fff;
min-height:100vh;
overflow-x:hidden
}

body:before{
content:"";
position:fixed;
inset:0;
z-index:-1;
background:
linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.85)),
url('https://a.top4top.io/p_38068co2c0.jpg');
background-size:cover;
background-position:center;
}

.marquee{
overflow:hidden;
background:rgba(0,0,0,.45);
padding:12px 0
}

.marquee span{
display:inline-block;
white-space:nowrap;
padding-left:100%;
color:#f5e6b3;
font-weight:700;
animation:move 18s linear infinite;
}

@keyframes move{
0%{transform:translateX(0)}
100%{transform:translateX(-100%)}
}

.header{
text-align:center;
padding:25px 15px
}

.header h1{
color:#f5e6b3
}

.content{
width:92%;
max-width:900px;
margin:20px auto 100px;
background:rgba(5,15,30,.65);
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
padding:20px;
line-height:2;
}

.content img{
width:100%;
border-radius:12px;
margin:10px 0
}

.content a{
display:block;
margin:10px 0;
padding:12px;
background:#0d2033;
border-radius:10px;
color:#f5e6b3;
text-decoration:none;
}

.back{
position:fixed;
left:15px;
bottom:15px;
padding:14px 20px;
border:none;
border-radius:14px;
background:#d4af37;
color:#06131f;
font-weight:bold;
cursor:pointer;
}

.audio-box{
margin:15px 0;
padding:14px;
background:#0d2033;
border-radius:14px;
border:1px solid rgba(255,255,255,.08);
}

.audio-title{
color:#f5e6b3;
margin-bottom:10px;
font-weight:700;
}

.audio-box audio{
width:100%;
border-radius:10px;
}

/* ================== إضافة الفصول ================== */
.box{
width:92%;
max-width:900px;
margin:10px auto;
background:rgba(5,15,30,.65);
border:1px solid rgba(255,255,255,.1);
border-radius:15px;
padding:15px;
}

.itemBtn{
padding:10px;
margin:8px 0;
background:#0d2033;
border-radius:10px;
cursor:pointer;
color:#f5e6b3;
}

.lessonBtn{
padding:10px;
margin:8px 0;
background:#112233;
border-radius:10px;
cursor:pointer;
}

/* ================== إضافات البحث والاختبارات ================== */
.search-box{
width:92%;
max-width:900px;
margin:15px auto;
}

.search-box input{
width:100%;
padding:14px;
border:1px solid rgba(255,255,255,.2);
border-radius:12px;
background:#0d2033;
color:#fff;
font-size:16px;
outline:none;
}

.search-box input::placeholder{
color:#aaa;
}

.nav-btns{
width:92%;
max-width:900px;
margin:15px auto;
display:flex;
gap:10px;
flex-wrap:wrap;
}

.nav-btn{
padding:12px 20px;
border:none;
border-radius:12px;
background:#0d2033;
color:#f5e6b3;
font-weight:700;
cursor:pointer;
border:1px solid rgba(255,255,255,.1);
}

.nav-btn:hover{
background:#1a3a5c;
}

.nav-btn.active{
background:#d4af37;
color:#06131f;
}

.modal-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
z-index:1000;
display:none;
justify-content:center;
align-items:center;
padding:20px;
}

.modal-overlay.show{
display:flex;
}

.modal{
background:#0d2033;
border:1px solid rgba(255,255,255,.15);
border-radius:20px;
width:100%;
max-width:600px;
max-height:90vh;
overflow-y:auto;
padding:25px;
position:relative;
}

.modal h2{
color:#f5e6b3;
margin-bottom:20px;
text-align:center;
}

.modal input, .modal select{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid rgba(255,255,255,.2);
border-radius:10px;
background:#06131f;
color:#fff;
font-size:16px;
outline:none;
}

.modal label{
display:block;
color:#f5e6b3;
margin:10px 0 5px;
}

.close-modal{
position:absolute;
top:15px;
left:15px;
background:#c0392b;
color:#fff;
border:none;
padding:8px 14px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.question-box{
background:#06131f;
border:1px solid rgba(255,255,255,.1);
border-radius:14px;
padding:20px;
margin:15px 0;
}

.question-box h4{
color:#f5e6b3;
margin-bottom:15px;
}

.question-text{
margin-bottom:15px;
color:#fff;
line-height:1.8;
font-size:16px;
}

.choices{
display:flex;
flex-direction:column;
gap:10px;
}

.choice{
padding:14px;
background:#0d2033;
border:1px solid rgba(255,255,255,.1);
border-radius:10px;
cursor:pointer;
transition:.3s;
text-align:right;
font-size:15px;
}

.choice:hover{
background:#1a3a5c;
}

.choice.selected{
background:#d4af37;
color:#06131f;
border-color:#d4af37;
}

.choice.wrong{
background:#c0392b;
border-color:#c0392b;
}

.choice.correct{
background:#27ae60;
border-color:#27ae60;
}

.result-box{
text-align:center;
padding:30px;
}

.result-score{
font-size:48px;
color:#f5e6b3;
font-weight:700;
}

.result-percent{
font-size:24px;
color:#27ae60;
margin:10px 0;
}

.participants-box{
width:92%;
max-width:900px;
margin:20px auto;
background:rgba(5,15,30,.65);
border:1px solid rgba(255,255,255,.1);
border-radius:15px;
padding:20px;
}

.participants-box h3{
color:#f5e6b3;
margin-bottom:15px;
}

.participant-item{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
margin:8px 0;
background:#0d2033;
border-radius:10px;
flex-wrap:wrap;
gap:10px;
}

.participant-info{
flex:1;
}

.participant-name{
color:#f5e6b3;
font-weight:700;
}

.participant-chapters{
color:#aaa;
font-size:14px;
}

.participant-score{
font-size:20px;
font-weight:700;
color:#27ae60;
}

.participant-actions{
display:flex;
gap:8px;
}

.participant-actions button{
padding:6px 12px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:14px;
}

.share-btn{
background:#25d366;
color:#fff;
}

.delete-btn{
background:#c0392b;
color:#fff;
}

.toast{
position:fixed;
top:20px;
right:20px;
background:#27ae60;
color:#fff;
padding:15px 25px;
border-radius:12px;
z-index:2000;
transform:translateX(150%);
transition:.5s;
font-weight:700;
}

.toast.show{
transform:translateX(0);
}

.empty-state{
text-align:center;
padding:40px;
color:#aaa;
}

.btn-primary{
background:#d4af37;
color:#06131f;
border:none;
padding:12px 24px;
border-radius:12px;
font-weight:700;
cursor:pointer;
font-size:16px;
}

.btn-secondary{
background:#0d2033;
color:#f5e6b3;
border:1px solid rgba(255,255,255,.1);
padding:10px 20px;
border-radius:10px;
cursor:pointer;
}

.timer{
text-align:center;
font-size:20px;
color:#e74c3c;
font-weight:700;
margin:10px 0;
}

.back-btn{
display:block;
margin:15px auto;
padding:12px 24px;
background:#0d2033;
color:#f5e6b3;
border:1px solid rgba(255,255,255,.1);
border-radius:12px;
cursor:pointer;
font-weight:700;
text-align:center;
width:92%;
max-width:900px;
}

.back-btn:hover{
background:#1a3a5c;
}

/* ======== إضافات للأسئلة المقالية ======== */
.open-answer{
width:100%;
padding:14px;
border:1px solid rgba(255,255,255,.2);
border-radius:12px;
background:#06131f;
color:#fff;
font-size:16px;
outline:none;
min-height:120px;
resize:vertical;
font-family:Cairo,sans-serif;
line-height:1.8;
margin-top:10px;
}

.open-answer::placeholder{
color:#888;
}

.open-answer.correct-answer{
border-color:#27ae60;
background:rgba(39,174,96,0.1);
}

.open-answer.partial-answer{
border-color:#d4af37;
background:rgba(212,175,55,0.1);
}

.open-answer.wrong-answer{
border-color:#c0392b;
background:rgba(192,57,43,0.1);
}

.answer-label{
color:#f5e6b3;
font-weight:700;
margin-top:15px;
margin-bottom:5px;
font-size:15px;
}

.model-answer-box{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.1);
border-radius:12px;
padding:15px;
margin-top:15px;
line-height:1.8;
}

.model-answer-title{
color:#d4af37;
font-weight:700;
margin-bottom:10px;
font-size:14px;
}

::-webkit-scrollbar{
width:8px;
}

::-webkit-scrollbar-track{
background:#06131f;
}

::-webkit-scrollbar-thumb{
background:#d4af37;
border-radius:4px;
}

@media(max-width:600px){
.participant-item{
flex-direction:column;
align-items:flex-start;
}
.participant-actions{
width:100%;
justify-content:flex-end;
}
}
</style>

</head>
<body>

<div class="marquee">
<span>
من يرد الله به خيراً يفقهه في الدين •
من يرد الله به خيراً يفقهه في الدين •
من يرد الله به خيراً يفقهه في الدين
</span>
</div>

<div class="header">
<h1 id="title">المادة</h1>
</div>

<!-- أزرار التنقل -->
<div class="nav-btns">
<button class="nav-btn" onclick="openExamSection()">✏️ الاختبارات</button>
<button class="nav-btn" onclick="openParticipantsSection()">🏆 مشاركات في الاختبارات</button>
</div>

<!-- البحث -->
<div class="search-box">
<input type="text" id="searchInput" placeholder="🔍 ابحث عن فصل أو درس..." oninput="performSearch()">
</div>

<!-- القسم الرئيسي: الفصول + الدروس + المحتوى -->
<div id="section-main">
<!-- 📂 الفصول -->
<div class="box">
<h3 style="color:#f5e6b3">📂 الفصول</h3>
<div id="chaptersList"></div>
</div>

<!-- 📖 الدروس -->
<div class="box" id="lessonsBox" style="display:none">
<h3 style="color:#f5e6b3">📖 الدروس</h3>
<div id="lessonsList"></div>
</div>

<!-- المحتوى القديم بدون تغيير -->
<div class="content" id="content"></div>
</div>

<!-- قسم الاختبارات -->
<div id="section-exam" style="display:none">
<button class="back-btn" onclick="backToMain()">⬅ العودة للمحتوى</button>

<div class="box">
<h3 style="color:#f5e6b3">✏️ إنشاء اختبار جديد</h3>
<p style="color:#aaa;margin-bottom:15px">يمكنك إنشاء اختبار لـ <strong>أي مادة</strong> تختارها من القائمة:</p>

<div style="margin:15px 0">
<label style="color:#f5e6b3;display:block;margin-bottom:5px">👤 اسم المشارك:</label>
<input type="text" id="examParticipantName" placeholder="أدخل اسمك" style="width:100%;padding:12px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:#06131f;color:#fff;outline:none">
</div>

<div style="margin:15px 0">
<label style="color:#f5e6b3;display:block;margin-bottom:5px">📚 اختر المادة:</label>
<select id="examSubjectSelect" onchange="loadExamChapters()" style="width:100%;padding:12px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:#06131f;color:#fff;outline:none">
<option value="">-- اختر المادة --</option>
</select>
</div>

<div style="margin:15px 0">
<label style="color:#f5e6b3;display:block;margin-bottom:5px">📂 الفصول المطلوبة (Ctrl+Click للاختيار المتعدد):</label>
<select id="examChaptersSelect" multiple style="width:100%;padding:12px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:#06131f;color:#fff;outline:none;min-height:120px">
<option value="">اختر المادة أولاً</option>
</select>
</div>

<div style="margin:15px 0">
<label style="color:#f5e6b3;display:block;margin-bottom:5px">🔢 عدد الأسئلة:</label>
<select id="examQuestionCount" style="width:100%;padding:12px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:#06131f;color:#fff;outline:none">
<option value="5">5 أسئلة</option>
<option value="10" selected>10 أسئلة</option>
<option value="15">15 سؤالاً</option>
<option value="20">20 سؤالاً</option>
<option value="30">30 سؤالاً</option>
<option value="50">50 سؤالاً</option>
</select>
</div>

<div style="margin:15px 0">
<label style="color:#f5e6b3;display:block;margin-bottom:5px">⏱️ مدة الاختبار (دقيقة):</label>
<select id="examDuration" style="width:100%;padding:12px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:#06131f;color:#fff;outline:none">
<option value="5">5 دقائق</option>
<option value="10">10 دقائق</option>
<option value="15" selected>15 دقيقة</option>
<option value="30">30 دقيقة</option>
<option value="60">60 دقيقة</option>
<option value="90">90 دقيقة</option>
</select>
</div>

<button class="btn-primary" onclick="window.startExam()" style="width:100%;margin-top:15px">
🚀 بدء الاختبار
</button>
</div>
</div>

<!-- قسم المشاركين -->
<div id="section-participants" style="display:none">
<button class="back-btn" onclick="backToMain()">⬅ العودة للمحتوى</button>

<div class="participants-box">
<h3>🏆 قائمة المشاركين في الاختبارات</h3>
<div id="participantsList"></div>
</div>
</div>

<!-- نافذة الاختبار -->
<div class="modal-overlay" id="examModal">
<div class="modal">
<button class="close-modal" onclick="closeExamModal()">✕</button>
<h2>📝 الاختبار</h2>
<div class="timer" id="examTimer">⏱️ 15:00</div>
<div id="examContent"></div>
</div>
</div>

<!-- نافذة النتيجة -->
<div class="modal-overlay" id="resultModal">
<div class="modal">
<div id="resultContent"></div>
</div>
</div>

<button class="back" onclick="location.href='index.html'">
⬅ الرجوع
</button>

<!-- إشعار -->
<div class="toast" id="toast"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
getDoc,
collection,
query,
where,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyAVHnPVmRegwOQGTugDN7oltRqlSM-5_wA",
 authDomain: "p-726bc.firebaseapp.com",
 projectId: "p-726bc",
 storageBucket: "p-726bc.firebasestorage.app",
 messagingSenderId: "752913389065",
 appId: "1:752913389065:web:20cf8c03fe4ace03650ad8"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
const id = params.get("id");

/* ================= اسم المادة ================= */
const names = {
aqida:"العقيدة",
hadith:"الحديث",
fiqh:"الفقه",
usul:"أصول الفقه",
history:"تاريخ الخلفاء الراشدين",
dawah:"منهج الدعوة",
tajweed:"أحكام وتجويد القرآن",
literature:"الدراسات الأدبية",
nahw:"النحو والصرف",
computer:"الحاسوب",
english:"الإنجليزي",
tafsir:"التفسير"
};

document.getElementById("title").textContent =
names[id] || "المادة";

/* ================= المحتوى القديم ================= */
const snap = await getDoc(doc(db,"subjects",id));

const content = document.getElementById("content");

if(snap.exists()){
 const data = snap.data();

 (data.items || []).forEach(item=>{

 if(item.type==="title"){
 content.innerHTML += `<h2>${item.text}</h2>`;
 }

 if(item.type==="text"){
 content.innerHTML += `<p>${item.text}</p>`;
 }

 if(item.type==="image"){
 content.innerHTML += `<img src="${item.url}">`;
 }

 if(item.type==="book"){
 content.innerHTML += `<a href="${item.url}" target="_blank">📚 ${item.name}</a>`;
 }

 if(item.type==="link"){
 content.innerHTML += `<a href="${item.url}" target="_blank">🔗 ${item.name}</a>`;
 }

 if(item.type==="audio"){
 content.innerHTML += `
 <div class="audio-box">
 <div class="audio-title">🎧 ${item.name}</div>
 <audio controls src="${item.url}"></audio>
 </div>`;
 }

 });
}


try{
const qLatest = query(collection(db,"lessons"),where("subject","==",id));
const sLatest = await getDocs(qLatest);
let latestTime = 0;
sLatest.forEach(d=>{
 const t=d.data().time || 0;
 if(t>latestTime) latestTime=t;
});
localStorage.setItem("seenTime_"+id, latestTime);
}catch(e){console.log(e);}

/* ================= الفصول + الدروس ================= */

let chaptersList = document.getElementById("chaptersList");
let lessonsList = document.getElementById("lessonsList");

async function loadChapters(){

const q = query(
collection(db,"chapters"),
where("subject","==",id)
);

const snap = await getDocs(q);

chaptersList.innerHTML = "";

let arr=[];
snap.forEach(docu=>{
arr.push({id:docu.id,...docu.data()});
});

arr.sort((a,b)=>(a.order||0)-(b.order||0));

arr.forEach(data=>{
const chapterId = data.id;

chaptersList.innerHTML += `
<div class="itemBtn" onclick="openChapter('${chapterId}')">
📂 ${data.title}
</div>`;
});
}

window.openChapter = async (chapterId)=>{

document.getElementById("lessonsBox").style.display="block";

const q = query(
collection(db,"lessons"),
where("chapterId","==",chapterId)
);

const snap = await getDocs(q);

lessonsList.innerHTML = "";

let arr=[];
snap.forEach(docu=>{
arr.push(docu.data());
});

arr.sort((a,b)=>(a.order||0)-(b.order||0));

arr.forEach(data=>{

lessonsList.innerHTML += `
<div class="lessonBtn" onclick='openLesson(${JSON.stringify(data)})'>
📖 ${data.title}
</div>`;
});
};

/* فتح درس داخل نفس الصفحة */
window.openLesson = (d)=>{

content.innerHTML = `
<h2 style="color:#f5e6b3">${d.title}</h2>
<p>${d.text || ""}</p>

${d.image ? `<img src="${d.image}">` : ""}

${d.audio ? `
<div class="audio-box">
<div class="audio-title">🎧 ${d.title}</div>
<audio controls src="${d.audio}"></audio>
</div>` : ""}

${d.link ? `<a href="${d.link}" target="_blank">🔗 ${d.link}</a>` : ""}
`;
};

/* ================= البحث ================= */
window.performSearch = function() {
const query = document.getElementById('searchInput').value.trim().toLowerCase();
if (!query) {
document.querySelectorAll('.itemBtn, .lessonBtn').forEach(el => {
el.style.display = 'block';
});
return;
}

document.querySelectorAll('.itemBtn').forEach(el => {
const text = el.textContent.toLowerCase();
el.style.display = text.includes(query) ? 'block' : 'none';
});

document.querySelectorAll('.lessonBtn').forEach(el => {
const text = el.textContent.toLowerCase();
el.style.display = text.includes(query) ? 'block' : 'none';
});

document.getElementById('lessonsBox').style.display = 'block';
};

/* ================= التنقل بين الأقسام ================= */
window.openExamSection = function() {
document.getElementById('section-main').style.display = 'none';
document.getElementById('section-participants').style.display = 'none';
document.getElementById('section-exam').style.display = 'block';
document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
event.target.classList.add('active');
loadSubjectsForExam();
};

window.openParticipantsSection = function() {
document.getElementById('section-main').style.display = 'none';
document.getElementById('section-exam').style.display = 'none';
document.getElementById('section-participants').style.display = 'block';
document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
event.target.classList.add('active');
loadParticipants();
};

window.backToMain = function() {
document.getElementById('section-main').style.display = 'block';
document.getElementById('section-exam').style.display = 'none';
document.getElementById('section-participants').style.display = 'none';
document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
};

/* ================= إنشاء الاختبار ================= */
let examQuestions = [];
let currentExam = {};
let examTimerInterval;

async function loadSubjectsForExam() {
const select = document.getElementById('examSubjectSelect');
select.innerHTML = '<option value="">-- اختر المادة --</option>';
for (const [key, name] of Object.entries(names)) {
select.innerHTML += `<option value="${key}">${name}</option>`;
}
if (id && names[id]) {
select.value = id;
loadExamChapters();
}
}

window.loadExamChapters = async function() {
const subject = document.getElementById('examSubjectSelect').value;
const select = document.getElementById('examChaptersSelect');
select.innerHTML = '';

if (!subject) {
select.innerHTML = '<option value="">اختر المادة أولاً</option>';
return;
}

const q = query(collection(db, 'chapters'), where('subject', '==', subject));
const snap = await getDocs(q);
let arr = [];
snap.forEach(docu => {
const data = docu.data();
// فقط فصول الأسئلة (التي اسمها يبدأ بـ "أسئلة" أو "اسئلة")
if (data.title && (data.title.startsWith('أسئلة') || data.title.startsWith('اسئلة'))) {
arr.push({id: docu.id, ...data});
}
});
arr.sort((a, b) => (a.order || 0) - (b.order || 0));

if (arr.length === 0) {
select.innerHTML = '<option value="">لا توجد فصول أسئلة في هذه المادة</option>';
return;
}

arr.forEach(ch => {
select.innerHTML += `<option value="${ch.id}">❓ ${ch.title}</option>`;
});
};

/* ================= بدء الاختبار - جلب الأسئلة كما هي ================= */
window.startExam = async function() {
console.log('=== بدء الاختبار ===');
try {
const name = document.getElementById('examParticipantName').value.trim();
const subject = document.getElementById('examSubjectSelect').value;
const chaptersSelect = document.getElementById('examChaptersSelect');
const selectedChapters = Array.from(chaptersSelect.selectedOptions).map(o => o.value);
const selectedChaptersNames = Array.from(chaptersSelect.selectedOptions).map(o => o.text.replace('❓ ', '').replace('📂 ', ''));
const questionCount = parseInt(document.getElementById('examQuestionCount').value);
const duration = parseInt(document.getElementById('examDuration').value);

if (!name) { showToast('❌ الرجاء إدخال اسم المشارك'); return; }
if (!subject) { showToast('❌ الرجاء اختيار المادة'); return; }
if (selectedChapters.length === 0) { showToast('❌ الرجاء اختيار فصل واحد على الأقل'); return; }

showToast('⏳ جاري تحميل الأسئلة...');

// جمع الدروس (الأسئلة) من فصول الأسئلة
let allQuestions = [];
for (const chId of selectedChapters) {
const q = query(collection(db, 'lessons'), where('chapterId', '==', chId));
const snap = await getDocs(q);
snap.forEach(docu => {
const data = docu.data();

// تحديد نوع السؤال: مقالي (open) أو اختياري (mcq)
const questionType = (data.type || 'mcq').toString().trim().toLowerCase();

// استخراج السؤال من الدرس
const questionObj = extractQuestionFromLesson(data);
if (questionObj) {
allQuestions.push(questionObj);
}
});
}

console.log('عدد الأسئلة المحملة:', allQuestions.length);

if (allQuestions.length === 0) { 
showToast('❌ لا توجد أسئلة في الفصول المختارة'); 
return; 
}

// خلط الأسئلة واختيار العدد المطلوب
const shuffled = [...allQuestions].sort(() => Math.random() - 0.5);
examQuestions = shuffled.slice(0, Math.min(questionCount, allQuestions.length));

console.log('عدد الأسئلة في الاختبار:', examQuestions.length);

currentExam = {
name,
subject: names[subject] || subject,
subjectKey: subject,
chapters: selectedChaptersNames,
totalQuestions: examQuestions.length,
duration: duration,
startTime: Date.now()
};

renderExam();
document.getElementById('examModal').classList.add('show');
startTimer(duration * 60);

} catch (error) {
console.error('خطأ:', error);
showToast('❌ حدث خطأ: ' + error.message);
}
};

/* ================= استخراج السؤال من الدرس كما هو ================= */
function extractQuestionFromLesson(lesson) {
const title = (lesson.title || '').trim();
const text = (lesson.text || '').trim();
const type = (lesson.type || 'mcq').toString().trim().toLowerCase();

if (!title) return null;

// سؤال مقالي (مفتوح) - الإجابة في text
if (type === 'open') {
return {
question: title,
correct: text,
isOpenEnded: true,
source: lesson.title || 'سؤال مقالي'
};
}

// سؤال اختياري (متعدد) - الخيارات مفصولة بـ |
const choices = text.split('|').map(c => c.trim()).filter(c => c.length > 0);
if (choices.length < 2) {
// إذا لم يكن هناك خيارات كافية، نعتبره سؤال مقالي
return {
question: title,
correct: text,
isOpenEnded: true,
source: lesson.title || 'سؤال'
};
}

// الإجابة الصحيحة = الخيار الأول
const correctAnswer = choices[0];
const otherChoices = choices.slice(1);

// خلط الخيارات
const allChoices = [correctAnswer, ...otherChoices];
const shuffled = allChoices.sort(() => Math.random() - 0.5);

return {
question: title,
choices: shuffled,
correct: correctAnswer,
isOpenEnded: false,
source: lesson.title || 'سؤال اختياري'
};
}

/* ================= عرض الاختبار ================= */
function renderExam() {
const container = document.getElementById('examContent');
container.innerHTML = '';

examQuestions.forEach((q, index) => {
if (q.isOpenEnded) {
// سؤال مقالي
container.innerHTML += `
<div class="question-box" id="q-${index}">
<h4>السؤال ${index + 1} من ${examQuestions.length}</h4>
<p class="question-text">${q.question}</p>
<div class="answer-label">✏️ اكتب إجابتك:</div>
<textarea class="open-answer" id="answer-${index}" placeholder="اكتب إجابتك هنا..." rows="4"></textarea>
</div>
`;
} else {
// سؤال اختياري
let choicesHtml = '';
q.choices.forEach((choice) => {
const safeChoice = choice.replace(/'/g, "\'").replace(/"/g, '\"');
choicesHtml += `<div class="choice" onclick="selectAnswer(${index}, '${safeChoice}', this)">${choice}</div>`;
});

container.innerHTML += `
<div class="question-box" id="q-${index}">
<h4>السؤال ${index + 1} من ${examQuestions.length}</h4>
<p class="question-text">${q.question}</p>
<div class="choices" id="choices-${index}">
${choicesHtml}
</div>
</div>
`;
}
});

container.innerHTML += `
<button class="btn-primary" onclick="submitExam()" style="width:100%;margin-top:20px">
✅ إنهاء الاختبار وتصحيح
</button>
`;
}

window.selectAnswer = function(qIndex, choice, element) {
const box = document.getElementById(`choices-${qIndex}`);
box.querySelectorAll('.choice').forEach(c => c.classList.remove('selected'));
element.classList.add('selected');
examQuestions[qIndex].userAnswer = choice;
};

function startTimer(seconds) {
const timerEl = document.getElementById('examTimer');
let remaining = seconds;

examTimerInterval = setInterval(() => {
remaining--;
const mins = Math.floor(remaining / 60);
const secs = remaining % 60;
timerEl.textContent = `⏱️ ${mins}:${secs.toString().padStart(2, '0')}`;

if (remaining <= 0) {
clearInterval(examTimerInterval);
submitExam();
showToast('⏰ انتهى وقت الاختبار!');
}
}, 1000);
}

window.closeExamModal = function() {
clearInterval(examTimerInterval);
document.getElementById('examModal').classList.remove('show');
};

window.submitExam = function() {
clearInterval(examTimerInterval);

let correctMCQ = 0;
let mcqTotal = 0;
let openTotal = 0;
let openScoreSum = 0;

examQuestions.forEach((q, i) => {
if (q.isOpenEnded) {
// سؤال مقالي
const userAnswer = document.getElementById(`answer-${i}`).value.trim();
q.userAnswer = userAnswer;

const score = calculateOpenScore(userAnswer, q.correct);
q.score = score;
openScoreSum += score;
openTotal++;

// تلوين الحقل
const textarea = document.getElementById(`answer-${i}`);
if (score >= 70) {
textarea.classList.add('correct-answer');
} else if (score >= 40) {
textarea.classList.add('partial-answer');
} else {
textarea.classList.add('wrong-answer');
}

// إضافة الإجابة النموذجية بعد التصحيح
const modelAnswerDiv = document.createElement('div');
modelAnswerDiv.className = 'model-answer-box';
modelAnswerDiv.innerHTML = `
<div class="model-answer-title">📖 الإجابة النموذجية:</div>
<div style="color:#aaa;line-height:1.8">${q.correct || 'لا يوجد إجابة نموذجية'}</div>
<div style="margin-top:10px;color:#f5e6b3;font-size:14px">✓ نسبة التطابق: ${score}%</div>
`;
textarea.parentNode.appendChild(modelAnswerDiv);

} else {
// سؤال اختياري
mcqTotal++;
const box = document.getElementById(`choices-${i}`);
if (!box) return;

box.querySelectorAll('.choice').forEach(c => {
if (c.textContent === q.correct) c.classList.add('correct');
if (c.textContent === q.userAnswer && q.userAnswer !== q.correct) c.classList.add('wrong');
});

if (q.userAnswer === q.correct) correctMCQ++;
}
});

// حساب النتيجة النهائية
const mcqPercent = mcqTotal > 0 ? Math.round((correctMCQ / mcqTotal) * 100) : 100;
const openPercent = openTotal > 0 ? Math.round(openScoreSum / openTotal) : 100;

// الوزن: 50% اختياري + 50% مقالي (إذا وجد النوعان)
let finalPercent;
if (mcqTotal > 0 && openTotal > 0) {
finalPercent = Math.round((mcqPercent + openPercent) / 2);
} else if (mcqTotal > 0) {
finalPercent = mcqPercent;
} else {
finalPercent = openPercent;
}

const totalQuestions = examQuestions.length;
const totalCorrect = correctMCQ + Math.round((openScoreSum / 100) * openTotal);

const result = {
id: Date.now(),
name: currentExam.name,
subject: currentExam.subject,
subjectKey: currentExam.subjectKey,
chapters: currentExam.chapters,
score: totalCorrect,
total: totalQuestions,
percent: finalPercent,
mcqScore: correctMCQ,
mcqTotal: mcqTotal,
openScore: openTotal > 0 ? Math.round(openScoreSum / openTotal) : 0,
openTotal: openTotal,
date: new Date().toLocaleString('ar-SA')
};

saveResult(result);
document.getElementById('examModal').classList.remove('show');
showResult(result);
};

/* ================= تصحيح الأسئلة المقالية - مقارنة ذكية ================= */
function calculateOpenScore(userAnswer, modelAnswer) {
if (!userAnswer || userAnswer.length < 3) return 0;
if (!modelAnswer || modelAnswer.length < 3) return 0;

// تنظيف النصوص
const cleanUser = cleanTextForComparison(userAnswer);
const cleanModel = cleanTextForComparison(modelAnswer);

// تقسيم الإجابة النموذجية إلى نقاط/جمل
const modelSentences = modelAnswer.split(/[.!؟\n]+/)
.map(s => s.trim())
.filter(s => s.length > 5);

const totalPoints = modelSentences.length || 1;
let matchedPoints = 0;

const userWords = cleanUser.split(/\s+/).filter(w => w.length > 2);

modelSentences.forEach(sentence => {
const sentenceWords = cleanTextForComparison(sentence).split(/\s+/).filter(w => w.length > 2);
if (sentenceWords.length === 0) return;

// حساب عدد الكلمات المشتركة
let commonWords = 0;
sentenceWords.forEach(word => {
if (userWords.includes(word)) commonWords++;
});

// نسبة التطابق للنقطة
const matchRatio = commonWords / sentenceWords.length;
if (matchRatio >= 0.3) matchedPoints++;
});

// حساب نسبة التطابق العامة
const sentenceScore = Math.round((matchedPoints / totalPoints) * 100);

// مقارنة النص كامل (للتعابير القصيرة)
const fullTextScore = calculateTextSimilarity(cleanUser, cleanModel);

// أخذ أعلى درجة
return Math.max(sentenceScore, fullTextScore);
}

function calculateTextSimilarity(text1, text2) {
if (!text1 || !text2) return 0;

const words1 = text1.split(/\s+/).filter(w => w.length > 2);
const words2 = text2.split(/\s+/).filter(w => w.length > 2);

if (words1.length === 0 || words2.length === 0) return 0;

const set1 = new Set(words1);
const set2 = new Set(words2);

const intersection = [...set1].filter(w => set2.has(w));
const union = new Set([...set1, ...set2]);

return Math.round((intersection.length / union.size) * 100);
}

function cleanTextForComparison(text) {
return text
.toLowerCase()
.replace(/[،,؛;:.!؟"'()\[\]{}]/g, ' ')
.replace(/\s+/g, ' ')
.trim();
}

function showResult(result) {
const container = document.getElementById('resultContent');
let emoji = result.percent >= 90 ? '🏆' : result.percent >= 80 ? '🎉' : result.percent >= 60 ? '👍' : result.percent >= 40 ? '💪' : '📚';
let message = result.percent >= 90 ? 'ممتاز! بارك الله فيك' : result.percent >= 80 ? 'أحسنت! تقدم رائع' : result.percent >= 60 ? 'جيد! واصل التقدم' : result.percent >= 40 ? 'حاول مراجعة الدروس' : 'حاول مرة أخرى';

// بناء تفاصيل الأسئلة المقالية
let openReview = '';
const openQuestions = examQuestions.filter(q => q.isOpenEnded);
if (openQuestions.length > 0) {
openReview = `
<div style="margin-top:25px;text-align:right">
<h3 style="color:#f5e6b3;margin-bottom:15px">📋 مراجعة الأسئلة المقالية</h3>
${openQuestions.map((q, i) => `
<div style="margin:15px 0;padding:15px;background:#06131f;border-radius:12px;border:1px solid rgba(255,255,255,.1)">
<p style="color:#f5e6b3;font-weight:bold;margin-bottom:10px">${q.question}</p>
<p style="color:${q.score >= 70 ? '#27ae60' : q.score >= 40 ? '#d4af37' : '#c0392b'};margin:8px 0;font-size:14px">
${q.score >= 70 ? '✓ إجابة صحيحة' : q.score >= 40 ? '⚠ إجابة مقبولة' : '✗ إجابة خاطئة'} 
(${q.score}%)
</p>
<p style="color:#fff;background:rgba(255,255,255,.05);padding:10px;border-radius:8px;line-height:1.8">${q.userAnswer || 'لم تُجب'}</p>
<p style="color:#d4af37;margin:8px 0;font-size:14px">📖 الإجابة النموذجية:</p>
<p style="color:#aaa;background:rgba(255,255,255,.05);padding:10px;border-radius:8px;line-height:1.8;white-space:pre-line">${q.correct}</p>
</div>
`).join('')}
</div>`;
}

container.innerHTML = `
<div class="result-box">
<div style="font-size:64px;margin-bottom:10px">${emoji}</div>
<h2 style="color:#f5e6b3;margin-bottom:20px">${message}</h2>
<div class="result-score">${result.score}/${result.total}</div>
<div class="result-percent">${result.percent}%</div>

${result.mcqTotal > 0 ? `<p style="color:#27ae60;margin:10px 0">✅ اختياري: ${result.mcqScore}/${result.mcqTotal}</p>` : ''}
${result.openTotal > 0 ? `<p style="color:#d4af37;margin:10px 0">📝 مقالي: ${result.openScore}%</p>` : ''}

<p style="color:#aaa;margin:15px 0">المادة: ${result.subject}</p>
<p style="color:#aaa;margin:5px 0">الفصول: ${result.chapters.join(' • ')}</p>
<p style="color:#aaa;margin:5px 0">التاريخ: ${result.date}</p>

${openReview}

<div style="margin-top:25px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
<button class="btn-primary" onclick="shareResult(${result.id})">
📤 مشاركة عبر واتساب
</button>
<button class="btn-secondary" onclick="closeResult()">
❌ إغلاق
</button>
</div>
</div>
`;

document.getElementById('resultModal').classList.add('show');
}

window.closeResult = function() {
document.getElementById('resultModal').classList.remove('show');
};

/* ================= حفظ وعرض النتائج ================= */
function saveResult(result) {
let results = JSON.parse(localStorage.getItem('examResults') || '[]');
results.push(result);
localStorage.setItem('examResults', JSON.stringify(results));
showToast('✅ تم حفظ النتيجة بنجاح!');
}

window.loadParticipants = function() {
const container = document.getElementById('participantsList');
let results = JSON.parse(localStorage.getItem('examResults') || '[]');

if (results.length === 0) {
container.innerHTML = `
<div class="empty-state">
<div style="font-size:48px;margin-bottom:15px">📭</div>
<p>لا توجد نتائج مسجلة بعد</p>
<p style="font-size:14px;margin-top:10px">أنشئ اختباراً لترى النتائج هنا</p>
</div>
`;
return;
}

results = results.reverse();

container.innerHTML = '';
results.forEach(r => {
let details = '';
if (r.mcqTotal > 0 && r.openTotal > 0) {
details = `<div style="color:#aaa;font-size:13px">✅ اختياري: ${r.mcqScore}/${r.mcqTotal} | 📝 مقالي: ${r.openScore}%</div>`;
} else if (r.mcqTotal > 0) {
details = `<div style="color:#aaa;font-size:13px">✅ اختياري: ${r.mcqScore}/${r.mcqTotal}</div>`;
} else if (r.openTotal > 0) {
details = `<div style="color:#aaa;font-size:13px">📝 مقالي: ${r.openScore}%</div>`;
}

container.innerHTML += `
<div class="participant-item">
<div class="participant-info">
<div class="participant-name">👤 ${r.name}</div>
<div class="participant-chapters">📚 ${r.subject} | 📂 ${r.chapters.join(' • ')}</div>
${details}
<div class="participant-chapters">📅 ${r.date}</div>
</div>
<div class="participant-score">${r.score}/${r.total} (${r.percent}%)</div>
<div class="participant-actions">
<button class="share-btn" onclick="shareResult(${r.id})">📤 واتساب</button>
<button class="delete-btn" onclick="deleteResult(${r.id})">🗑️ حذف</button>
</div>
</div>
`;
});
};

window.deleteResult = function(resultId) {
if (!confirm('هل أنت متأكد من حذف هذه النتيجة؟')) return;

let results = JSON.parse(localStorage.getItem('examResults') || '[]');
results = results.filter(r => r.id !== resultId);
localStorage.setItem('examResults', JSON.stringify(results));
loadParticipants();
showToast('🗑️ تم حذف النتيجة');
};

window.shareResult = function(resultId) {
let results = JSON.parse(localStorage.getItem('examResults') || '[]');
const result = results.find(r => r.id === resultId);
if (!result) return;

let details = '';
if (result.mcqTotal > 0) {
details += `✅ اختياري: ${result.mcqScore}/${result.mcqTotal}
`;
}
if (result.openTotal > 0) {
details += `📝 مقالي: ${result.openScore}%
`;
}

const text = `🎓 نتيجة الاختبار
👤 الاسم: ${result.name}
📚 المادة: ${result.subject}
📂 الفصول: ${result.chapters.join(' • ')}
${details}✅ النتيجة: ${result.score}/${result.total}
📊 النسبة: ${result.percent}%
📅 التاريخ: ${result.date}

🌟 تم الاختبار عبر تطبيق التعليم`;

const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
window.open(url, '_blank');
};

/* ================= إشعارات ================= */
window.showToast = function(message) {
const toast = document.getElementById('toast');
toast.textContent = message;
toast.classList.add('show');
setTimeout(() => toast.classList.remove('show'), 3000);
};

/* تشغيل */
loadChapters();

</script>
