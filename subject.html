<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>عرض المادة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Cairo,sans-serif
}

body{
background:#06131f;
color:#fff;
min-height:100vh;
overflow-x:hidden
}

body:before{
content:"";
position:fixed;
inset:0;
z-index:-1;
background:
linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.85)),
url('https://a.top4top.io/p_38068co2c0.jpg');
background-size:cover;
background-position:center;
}

.marquee{
overflow:hidden;
background:rgba(0,0,0,.45);
padding:12px 0
}

.marquee span{
display:inline-block;
white-space:nowrap;
padding-left:100%;
color:#f5e6b3;
font-weight:700;
animation:move 18s linear infinite;
}

@keyframes move{
0%{transform:translateX(0)}
100%{transform:translateX(-100%)}
}

.header{
text-align:center;
padding:25px 15px
}

.header h1{
color:#f5e6b3
}

.content{
width:92%;
max-width:900px;
margin:20px auto 100px;
background:rgba(5,15,30,.65);
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
padding:20px;
line-height:2;
}

.content img{
width:100%;
border-radius:12px;
margin:10px 0
}

.content a{
display:block;
margin:10px 0;
padding:12px;
background:#0d2033;
border-radius:10px;
color:#f5e6b3;
text-decoration:none;
}

.back{
position:fixed;
left:15px;
bottom:15px;
padding:14px 20px;
border:none;
border-radius:14px;
background:#d4af37;
color:#06131f;
font-weight:bold;
cursor:pointer;
}

.audio-box{
margin:15px 0;
padding:14px;
background:#0d2033;
border-radius:14px;
border:1px solid rgba(255,255,255,.08);
}

.audio-title{
color:#f5e6b3;
margin-bottom:10px;
font-weight:700;
}

.audio-box audio{
width:100%;
border-radius:10px;
}

/* ================== إضافة الفصول ================== */
.box{
width:92%;
max-width:900px;
margin:10px auto;
background:rgba(5,15,30,.65);
border:1px solid rgba(255,255,255,.1);
border-radius:15px;
padding:15px;
}

.itemBtn{
padding:10px;
margin:8px 0;
background:#0d2033;
border-radius:10px;
cursor:pointer;
color:#f5e6b3;
}

.lessonBtn{
padding:10px;
margin:8px 0;
background:#112233;
border-radius:10px;
cursor:pointer;
}

/* ================== إضافات البحث والاختبارات ================== */
.search-box{
width:92%;
max-width:900px;
margin:15px auto;
}

.search-box input{
width:100%;
padding:14px;
border:1px solid rgba(255,255,255,.2);
border-radius:12px;
background:#0d2033;
color:#fff;
font-size:16px;
outline:none;
}

.search-box input::placeholder{
color:#aaa;
}

.nav-btns{
width:92%;
max-width:900px;
margin:15px auto;
display:flex;
gap:10px;
flex-wrap:wrap;
}

.nav-btn{
padding:12px 20px;
border:none;
border-radius:12px;
background:#0d2033;
color:#f5e6b3;
font-weight:700;
cursor:pointer;
border:1px solid rgba(255,255,255,.1);
}

.nav-btn:hover{
background:#1a3a5c;
}

.nav-btn.active{
background:#d4af37;
color:#06131f;
}

.modal-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
z-index:1000;
display:none;
justify-content:center;
align-items:center;
padding:20px;
}

.modal-overlay.show{
display:flex;
}

.modal{
background:#0d2033;
border:1px solid rgba(255,255,255,.15);
border-radius:20px;
width:100%;
max-width:600px;
max-height:90vh;
overflow-y:auto;
padding:25px;
position:relative;
}

.modal h2{
color:#f5e6b3;
margin-bottom:20px;
text-align:center;
}

.modal input, .modal select{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid rgba(255,255,255,.2);
border-radius:10px;
background:#06131f;
color:#fff;
font-size:16px;
outline:none;
}

.modal label{
display:block;
color:#f5e6b3;
margin:10px 0 5px;
}

.close-modal{
position:absolute;
top:15px;
left:15px;
background:#c0392b;
color:#fff;
border:none;
padding:8px 14px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.question-box{
background:#06131f;
border:1px solid rgba(255,255,255,.1);
border-radius:14px;
padding:20px;
margin:15px 0;
}

.question-box h4{
color:#f5e6b3;
margin-bottom:15px;
}

.question-text{
margin-bottom:15px;
color:#fff;
line-height:1.8;
font-size:16px;
}

.choices{
display:flex;
flex-direction:column;
gap:10px;
}

.choice{
padding:14px;
background:#0d2033;
border:1px solid rgba(255,255,255,.1);
border-radius:10px;
cursor:pointer;
transition:.3s;
text-align:right;
font-size:15px;
}

.choice:hover{
background:#1a3a5c;
}

.choice.selected{
background:#d4af37;
color:#06131f;
border-color:#d4af37;
}

.choice.wrong{
background:#c0392b;
border-color:#c0392b;
}

.choice.correct{
background:#27ae60;
border-color:#27ae60;
}

.result-box{
text-align:center;
padding:30px;
}

.result-score{
font-size:48px;
color:#f5e6b3;
font-weight:700;
}

.result-percent{
font-size:24px;
color:#27ae60;
margin:10px 0;
}

.participants-box{
width:92%;
max-width:900px;
margin:20px auto;
background:rgba(5,15,30,.65);
border:1px solid rgba(255,255,255,.1);
border-radius:15px;
padding:20px;
}

.participants-box h3{
color:#f5e6b3;
margin-bottom:15px;
}

.participant-item{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
margin:8px 0;
background:#0d2033;
border-radius:10px;
flex-wrap:wrap;
gap:10px;
}

.participant-info{
flex:1;
}

.participant-name{
color:#f5e6b3;
font-weight:700;
}

.participant-chapters{
color:#aaa;
font-size:14px;
}

.participant-score{
font-size:20px;
font-weight:700;
color:#27ae60;
}

.participant-actions{
display:flex;
gap:8px;
}

.participant-actions button{
padding:6px 12px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:14px;
}

.share-btn{
background:#25d366;
color:#fff;
}

.delete-btn{
background:#c0392b;
color:#fff;
}

.toast{
position:fixed;
top:20px;
right:20px;
background:#27ae60;
color:#fff;
padding:15px 25px;
border-radius:12px;
z-index:2000;
transform:translateX(150%);
transition:.5s;
font-weight:700;
}

.toast.show{
transform:translateX(0);
}

.empty-state{
text-align:center;
padding:40px;
color:#aaa;
}

.btn-primary{
background:#d4af37;
color:#06131f;
border:none;
padding:12px 24px;
border-radius:12px;
font-weight:700;
cursor:pointer;
font-size:16px;
}

.btn-secondary{
background:#0d2033;
color:#f5e6b3;
border:1px solid rgba(255,255,255,.1);
padding:10px 20px;
border-radius:10px;
cursor:pointer;
}

.timer{
text-align:center;
font-size:20px;
color:#e74c3c;
font-weight:700;
margin:10px 0;
}

.back-btn{
display:block;
margin:15px auto;
padding:12px 24px;
background:#0d2033;
color:#f5e6b3;
border:1px solid rgba(255,255,255,.1);
border-radius:12px;
cursor:pointer;
font-weight:700;
text-align:center;
width:92%;
max-width:900px;
}

.back-btn:hover{
background:#1a3a5c;
}

::-webkit-scrollbar{
width:8px;
}

::-webkit-scrollbar-track{
background:#06131f;
}

::-webkit-scrollbar-thumb{
background:#d4af37;
border-radius:4px;
}

@media(max-width:600px){
.participant-item{
flex-direction:column;
align-items:flex-start;
}
.participant-actions{
width:100%;
justify-content:flex-end;
}
}
</style>

</head>
<body>

<div class="marquee">
<span>
من يرد الله به خيراً يفقهه في الدين •
من يرد الله به خيراً يفقهه في الدين •
من يرد الله به خيراً يفقهه في الدين
</span>
</div>

<div class="header">
<h1 id="title">المادة</h1>
</div>

<!-- أزرار التنقل -->
<div class="nav-btns">
<button class="nav-btn" onclick="openExamSection()">✏️ الاختبارات</button>
<button class="nav-btn" onclick="openParticipantsSection()">🏆 مشاركات في الاختبارات</button>
</div>

<!-- البحث -->
<div class="search-box">
<input type="text" id="searchInput" placeholder="🔍 ابحث عن فصل أو درس..." oninput="performSearch()">
</div>

<!-- القسم الرئيسي: الفصول + الدروس + المحتوى -->
<div id="section-main">
<!-- 📂 الفصول -->
<div class="box">
<h3 style="color:#f5e6b3">📂 الفصول</h3>
<div id="chaptersList"></div>
</div>

<!-- 📖 الدروس -->
<div class="box" id="lessonsBox" style="display:none">
<h3 style="color:#f5e6b3">📖 الدروس</h3>
<div id="lessonsList"></div>
</div>

<!-- المحتوى القديم بدون تغيير -->
<div class="content" id="content"></div>
</div>

<!-- قسم الاختبارات -->
<div id="section-exam" style="display:none">
<button class="back-btn" onclick="backToMain()">⬅ العودة للمحتوى</button>

<div class="box">
<h3 style="color:#f5e6b3">✏️ إنشاء اختبار جديد</h3>
<p style="color:#aaa;margin-bottom:15px">يمكنك إنشاء اختبار لـ <strong>أي مادة</strong> تختارها من القائمة:</p>

<div style="margin:15px 0">
<label style="color:#f5e6b3;display:block;margin-bottom:5px">👤 اسم المشارك:</label>
<input type="text" id="examParticipantName" placeholder="أدخل اسمك" style="width:100%;padding:12px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:#06131f;color:#fff;outline:none">
</div>

<div style="margin:15px 0">
<label style="color:#f5e6b3;display:block;margin-bottom:5px">📚 اختر المادة:</label>
<select id="examSubjectSelect" onchange="loadExamChapters()" style="width:100%;padding:12px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:#06131f;color:#fff;outline:none">
<option value="">-- اختر المادة --</option>
</select>
</div>

<div style="margin:15px 0">
<label style="color:#f5e6b3;display:block;margin-bottom:5px">📂 الفصول المطلوبة (Ctrl+Click للاختيار المتعدد):</label>
<select id="examChaptersSelect" multiple style="width:100%;padding:12px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:#06131f;color:#fff;outline:none;min-height:120px">
<option value="">اختر المادة أولاً</option>
</select>
</div>

<div style="margin:15px 0">
<label style="color:#f5e6b3;display:block;margin-bottom:5px">🔢 عدد الأسئلة:</label>
<select id="examQuestionCount" style="width:100%;padding:12px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:#06131f;color:#fff;outline:none">
<option value="5">5 أسئلة</option>
<option value="10" selected>10 أسئلة</option>
<option value="15">15 سؤالاً</option>
<option value="20">20 سؤالاً</option>
</select>
</div>

<div style="margin:15px 0">
<label style="color:#f5e6b3;display:block;margin-bottom:5px">⏱️ مدة الاختبار (دقيقة):</label>
<select id="examDuration" style="width:100%;padding:12px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:#06131f;color:#fff;outline:none">
<option value="5">5 دقائق</option>
<option value="10">10 دقائق</option>
<option value="15" selected>15 دقيقة</option>
<option value="30">30 دقيقة</option>
<option value="60">60 دقيقة</option>
</select>
</div>

<button class="btn-primary" onclick="window.startExam()" style="width:100%;margin-top:15px">
🚀 بدء الاختبار
</button>
</div>
</div>

<!-- قسم المشاركين -->
<div id="section-participants" style="display:none">
<button class="back-btn" onclick="backToMain()">⬅ العودة للمحتوى</button>

<div class="participants-box">
<h3>🏆 قائمة المشاركين في الاختبارات</h3>
<div id="participantsList"></div>
</div>
</div>

<!-- نافذة الاختبار -->
<div class="modal-overlay" id="examModal">
<div class="modal">
<button class="close-modal" onclick="closeExamModal()">✕</button>
<h2>📝 الاختبار</h2>
<div class="timer" id="examTimer">⏱️ 15:00</div>
<div id="examContent"></div>
</div>
</div>

<!-- نافذة النتيجة -->
<div class="modal-overlay" id="resultModal">
<div class="modal">
<div id="resultContent"></div>
</div>
</div>

<button class="back" onclick="location.href='index.html'">
⬅ الرجوع
</button>

<!-- إشعار -->
<div class="toast" id="toast"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
getDoc,
collection,
query,
where,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyAVHnPVmRegwOQGTugDN7oltRqlSM-5_wA",
 authDomain: "p-726bc.firebaseapp.com",
 projectId: "p-726bc",
 storageBucket: "p-726bc.firebasestorage.app",
 messagingSenderId: "752913389065",
 appId: "1:752913389065:web:20cf8c03fe4ace03650ad8"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
const id = params.get("id");

/* ================= اسم المادة ================= */
const names = {
aqida:"العقيدة",
hadith:"الحديث",
fiqh:"الفقه",
usul:"أصول الفقه",
history:"تاريخ الخلفاء الراشدين",
dawah:"منهج الدعوة",
tajweed:"أحكام وتجويد القرآن",
literature:"الدراسات الأدبية",
nahw:"النحو والصرف",
computer:"الحاسوب",
english:"الإنجليزي",
tafsir:"التفسير"
};

document.getElementById("title").textContent =
names[id] || "المادة";

/* ================= المحتوى القديم ================= */
const snap = await getDoc(doc(db,"subjects",id));

const content = document.getElementById("content");

if(snap.exists()){
 const data = snap.data();

 (data.items || []).forEach(item=>{

 if(item.type==="title"){
 content.innerHTML += `<h2>${item.text}</h2>`;
 }

 if(item.type==="text"){
 content.innerHTML += `<p>${item.text}</p>`;
 }

 if(item.type==="image"){
 content.innerHTML += `<img src="${item.url}">`;
 }

 if(item.type==="book"){
 content.innerHTML += `<a href="${item.url}" target="_blank">📚 ${item.name}</a>`;
 }

 if(item.type==="link"){
 content.innerHTML += `<a href="${item.url}" target="_blank">🔗 ${item.name}</a>`;
 }

 if(item.type==="audio"){
 content.innerHTML += `
 <div class="audio-box">
 <div class="audio-title">🎧 ${item.name}</div>
 <audio controls src="${item.url}"></audio>
 </div>`;
 }

 });
}


try{
const qLatest = query(collection(db,"lessons"),where("subject","==",id));
const sLatest = await getDocs(qLatest);
let latestTime = 0;
sLatest.forEach(d=>{
 const t=d.data().time || 0;
 if(t>latestTime) latestTime=t;
});
localStorage.setItem("seenTime_"+id, latestTime);
}catch(e){console.log(e);}

/* ================= الفصول + الدروس ================= */

let chaptersList = document.getElementById("chaptersList");
let lessonsList = document.getElementById("lessonsList");

async function loadChapters(){

const q = query(
collection(db,"chapters"),
where("subject","==",id)
);

const snap = await getDocs(q);

chaptersList.innerHTML = "";

let arr=[];
snap.forEach(docu=>{
arr.push({id:docu.id,...docu.data()});
});

arr.sort((a,b)=>(a.order||0)-(b.order||0));

arr.forEach(data=>{
const chapterId = data.id;

chaptersList.innerHTML += `
<div class="itemBtn" onclick="openChapter('${chapterId}')">
📂 ${data.title}
</div>`;
});
}

window.openChapter = async (chapterId)=>{

document.getElementById("lessonsBox").style.display="block";

const q = query(
collection(db,"lessons"),
where("chapterId","==",chapterId)
);

const snap = await getDocs(q);

lessonsList.innerHTML = "";

let arr=[];
snap.forEach(docu=>{
arr.push(docu.data());
});

arr.sort((a,b)=>(a.order||0)-(b.order||0));

arr.forEach(data=>{

lessonsList.innerHTML += `
<div class="lessonBtn" onclick='openLesson(${JSON.stringify(data)})'>
📖 ${data.title}
</div>`;
});
};

/* فتح درس داخل نفس الصفحة */
window.openLesson = (d)=>{

content.innerHTML = `
<h2 style="color:#f5e6b3">${d.title}</h2>
<p>${d.text || ""}</p>

${d.image ? `<img src="${d.image}">` : ""}

${d.audio ? `
<div class="audio-box">
<div class="audio-title">🎧 ${d.title}</div>
<audio controls src="${d.audio}"></audio>
</div>` : ""}

${d.link ? `<a href="${d.link}" target="_blank">🔗 ${d.link}</a>` : ""}
`;
};

/* ================= البحث ================= */
window.performSearch = function() {
const query = document.getElementById('searchInput').value.trim().toLowerCase();
if (!query) {
document.querySelectorAll('.itemBtn, .lessonBtn').forEach(el => {
el.style.display = 'block';
});
return;
}

document.querySelectorAll('.itemBtn').forEach(el => {
const text = el.textContent.toLowerCase();
el.style.display = text.includes(query) ? 'block' : 'none';
});

document.querySelectorAll('.lessonBtn').forEach(el => {
const text = el.textContent.toLowerCase();
el.style.display = text.includes(query) ? 'block' : 'none';
});

document.getElementById('lessonsBox').style.display = 'block';
};

/* ================= التنقل بين الأقسام ================= */
window.openExamSection = function() {
document.getElementById('section-main').style.display = 'none';
document.getElementById('section-participants').style.display = 'none';
document.getElementById('section-exam').style.display = 'block';
document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
event.target.classList.add('active');
loadSubjectsForExam();
};

window.openParticipantsSection = function() {
document.getElementById('section-main').style.display = 'none';
document.getElementById('section-exam').style.display = 'none';
document.getElementById('section-participants').style.display = 'block';
document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
event.target.classList.add('active');
loadParticipants();
};

window.backToMain = function() {
document.getElementById('section-main').style.display = 'block';
document.getElementById('section-exam').style.display = 'none';
document.getElementById('section-participants').style.display = 'none';
document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
};

/* ================= إنشاء الاختبار ================= */
let examQuestions = [];
let currentExam = {};
let examTimerInterval;

async function loadSubjectsForExam() {
const select = document.getElementById('examSubjectSelect');
select.innerHTML = '<option value="">-- اختر المادة --</option>';
for (const [key, name] of Object.entries(names)) {
select.innerHTML += `<option value="${key}">${name}</option>`;
}
if (id && names[id]) {
select.value = id;
loadExamChapters();
}
}

window.loadExamChapters = async function() {
const subject = document.getElementById('examSubjectSelect').value;
const select = document.getElementById('examChaptersSelect');
select.innerHTML = '';

if (!subject) {
select.innerHTML = '<option value="">اختر المادة أولاً</option>';
return;
}

const q = query(collection(db, 'chapters'), where('subject', '==', subject));
const snap = await getDocs(q);
let arr = [];
snap.forEach(docu => arr.push({id: docu.id, ...docu.data()}));
arr.sort((a, b) => (a.order || 0) - (b.order || 0));

if (arr.length === 0) {
select.innerHTML = '<option value="">لا توجد فصول في هذه المادة</option>';
return;
}

arr.forEach(ch => {
select.innerHTML += `<option value="${ch.id}">📂 ${ch.title}</option>`;
});
};

/* ================= بدء الاختبار - توليد من الدروس ================= */
window.startExam = async function() {
console.log('=== بدء الاختبار ===');
try {
const name = document.getElementById('examParticipantName').value.trim();
const subject = document.getElementById('examSubjectSelect').value;
const chaptersSelect = document.getElementById('examChaptersSelect');
const selectedChapters = Array.from(chaptersSelect.selectedOptions).map(o => o.value);
const selectedChaptersNames = Array.from(chaptersSelect.selectedOptions).map(o => o.text.replace('📂 ', ''));
const questionCount = parseInt(document.getElementById('examQuestionCount').value);
const duration = parseInt(document.getElementById('examDuration').value);

if (!name) { showToast('❌ الرجاء إدخال اسم المشارك'); return; }
if (!subject) { showToast('❌ الرجاء اختيار المادة'); return; }
if (selectedChapters.length === 0) { showToast('❌ الرجاء اختيار فصل واحد على الأقل'); return; }

showToast('⏳ جاري تحميل الدروس...');

// جمع الدروس من الفصول المختارة (الفصول العادية)
let lessons = [];
for (const chId of selectedChapters) {
const q = query(collection(db, 'lessons'), where('chapterId', '==', chId));
const snap = await getDocs(q);
snap.forEach(docu => {
const data = docu.data();
lessons.push({
id: docu.id,
title: data.title || '',
text: data.text || '',
...data
});
});
}

console.log('عدد الدروس المحملة:', lessons.length);

if (lessons.length === 0) { 
showToast('❌ لا توجد دروس في الفصول المختارة'); 
return; 
}

showToast('⏳ جاري إنشاء الأسئلة...');

// توليد الأسئلة من الدروس
examQuestions = generateQuestionsFromLessons(lessons, Math.min(questionCount, lessons.length * 3));
console.log('عدد الأسئلة المُنشأة:', examQuestions.length);

if (examQuestions.length === 0) { 
showToast('❌ لا يمكن إنشاء أسئلة من هذه الدروس - تأكد من وجود نصوص كافية'); 
return; 
}

currentExam = {
name,
subject: names[subject] || subject,
subjectKey: subject,
chapters: selectedChaptersNames,
totalQuestions: examQuestions.length,
duration: duration,
startTime: Date.now()
};

console.log('عرض الاختبار...');
renderExam();
document.getElementById('examModal').classList.add('show');
startTimer(duration * 60);

} catch (error) {
console.error('خطأ:', error);
showToast('❌ حدث خطأ: ' + error.message);
}
};

/* ================= توليد أسئلة منطقية من الدروس ================= */
function generateQuestionsFromLessons(lessons, count) {
console.log('توليد', count, 'سؤال من', lessons.length, 'درس');
let questions = [];

// خلط الدروس
const shuffledLessons = [...lessons].sort(() => Math.random() - 0.5);

for (const lesson of shuffledLessons) {
if (questions.length >= count) break;

const text = (lesson.text || '').trim();
if (text.length < 50) continue; // تجاهل النصوص القصيرة جداً

// تقسيم النص إلى جمل منطقية
const sentences = extractMeaningfulSentences(text);
if (sentences.length === 0) continue;

// محاولة توليد أسئلة من الجمل
for (const sentence of sentences) {
if (questions.length >= count) break;

const question = createQuestionFromSentence(sentence, text, lesson.title);
if (question && isValidQuestion(question)) {
questions.push(question);
}
}
}

return questions.slice(0, count);
}

/* ================= استخراج جمل ذات معنى ================= */
function extractMeaningfulSentences(text) {
// تقسيم النص إلى جمل كاملة
const rawSentences = text.split(/[.!؟]+/)
.map(s => s.trim())
.filter(s => s.length >= 30 && s.length <= 200); // جمل متوسطة الطول

const meaningful = [];

for (const sentence of rawSentences) {
// تجاهل الجمل التي لا تحتوي على معلومة واضحة
if (!hasClearInformation(sentence)) continue;

// تجاهل الجمل التي تحتوي على روابط أو أكواد
if (sentence.includes('http') || sentence.includes('www')) continue;
if (sentence.includes('function') || sentence.includes('var ') || sentence.includes('const ')) continue;

meaningful.push(sentence);
}

return meaningful;
}

/* ================= التحقق من وجود معلومة واضحة ================= */
function hasClearInformation(sentence) {
// يجب أن تحتوي الجملة على كلمات ذات معنى
const meaningfulWords = sentence.split(/\s+/).filter(w => w.length > 3);
if (meaningfulWords.length < 4) return false;

// يجب أن تحتوي على فعل أو اسم
const hasVerb = /(هو|هي|يكون|تكون|يعني|تعني|يقوم|تقوم|يشمل|تشمل|يفيد|تفيد|يدل|تدل|يعد|تعد|يعتبر|تعتبر|يسمى|تسمى|يُعرّف|تُعرّف|يُعرّف|تُعرّف)/.test(sentence);
const hasNoun = sentence.length > 20;

return hasVerb || hasNoun;
}

/* ================= إنشاء سؤال من جملة ================= */
function createQuestionFromSentence(sentence, fullText, lessonTitle) {
// محاولة 1: تعريف (الشيء هو...)
const defMatch = sentence.match(/(.{3,30}?)(?:\s+هو|\s+هي|\s+يعني|\s+تعني|\s+يُعرّف|\s+تُعرّف|\s+يُعرّف|\s+تُعرّف)\s+(.{10,100})/);
if (defMatch) {
const term = defMatch[1].trim();
const definition = defMatch[2].trim();
if (term.length >= 3 && definition.length >= 15 && !isVague(definition)) {
const wrongAnswers = generateWrongAnswers(fullText, sentence, definition);
if (wrongAnswers.length >= 2) {
return buildMCQ(`ما هو تعريف "${term}"؟`, definition, wrongAnswers, lessonTitle);
}
}
}

// محاولة 2: سبب (لأن...)
const reasonMatch = sentence.match(/(.{5,40}?)\s+(?:لأن|لِ)\s+(.{10,100})/);
if (reasonMatch) {
const action = reasonMatch[1].trim();
const reason = reasonMatch[2].trim();
if (action.length >= 5 && reason.length >= 15 && !isVague(reason)) {
const wrongAnswers = generateWrongAnswers(fullText, sentence, reason);
if (wrongAnswers.length >= 2) {
return buildMCQ(`لماذا ${action}؟`, reason, wrongAnswers, lessonTitle);
}
}
}

// محاولة 3: شرط (إذا... ف...)
const conditionMatch = sentence.match(/(?:إذا|من|كل من)\s+(.{5,40}?)\s+(?:فـ|فإن|فعليه|يجب عليه|فيجب|فيتوجب)\s+(.{10,100})/);
if (conditionMatch) {
const condition = conditionMatch[1].trim();
const result = conditionMatch[2].trim();
if (condition.length >= 5 && result.length >= 15 && !isVague(result)) {
const wrongAnswers = generateWrongAnswers(fullText, sentence, result);
if (wrongAnswers.length >= 2) {
return buildMCQ(`ما هو الشيء الواجب عند ${condition}؟`, result, wrongAnswers, lessonTitle);
}
}
}

// محاولة 4: يتكون من / يشمل
const partsMatch = sentence.match(/(.{3,30}?)\s+(?:يتكون من|تتكون من|يشمل|تشمل|يحتوي على|تحتوي على|فيه|فيهما)\s+(.{10,100})/);
if (partsMatch) {
const term = partsMatch[1].trim();
const parts = partsMatch[2].trim();
if (term.length >= 3 && parts.length >= 15 && !isVague(parts)) {
const wrongAnswers = generateWrongAnswers(fullText, sentence, parts);
if (wrongAnswers.length >= 2) {
return buildMCQ(`ما هي أجزاء/محتوى "${term}"؟`, parts, wrongAnswers, lessonTitle);
}
}
}

// محاولة 5: وقت/مكان (يكون في/عند/بعد)
const timeMatch = sentence.match(/(.{3,30}?)\s+(?:يكون|تكون|يقع|تقع|يحدث|تحدث)\s+(?:في|عند|بعد|قبل|عندما|إذا)\s+(.{10,100})/);
if (timeMatch) {
const term = timeMatch[1].trim();
const time = timeMatch[2].trim();
if (term.length >= 3 && time.length >= 15 && !isVague(time)) {
const wrongAnswers = generateWrongAnswers(fullText, sentence, time);
if (wrongAnswers.length >= 2) {
return buildMCQ(`متى/أين يكون ${term}؟`, time, wrongAnswers, lessonTitle);
}
}
}

// محاولة 6: فعل + مفعول به واضح
const actionMatch = sentence.match(/(.{3,25}?)\s+(?:يفعل|تفعل|يقوم|تقوم|يؤدي|تؤدي|يسبب|تسبب|ينتج|تنتج)\s+(.{10,100})/);
if (actionMatch) {
const actor = actionMatch[1].trim();
const result = actionMatch[2].trim();
if (actor.length >= 3 && result.length >= 15 && !isVague(result)) {
const wrongAnswers = generateWrongAnswers(fullText, sentence, result);
if (wrongAnswers.length >= 2) {
return buildMCQ(`ما هو نتيجة/أثر ${actor}؟`, result, wrongAnswers, lessonTitle);
}
}
}

return null;
}

/* ================= بناء سؤال اختياري ================= */
function buildMCQ(questionText, correctAnswer, wrongAnswers, source) {
const allChoices = [correctAnswer, ...wrongAnswers.slice(0, 3)];
const shuffled = allChoices.sort(() => Math.random() - 0.5);

return {
question: questionText,
choices: shuffled,
correct: correctAnswer,
source: source || 'سؤال'
};
}

/* ================= توليد إجابات خاطئة ================= */
function generateWrongAnswers(fullText, correctSentence, correctAnswer) {
const wrongAnswers = [];
const allSentences = fullText.split(/[.!؟]+/)
.map(s => s.trim())
.filter(s => s.length >= 30 && s !== correctSentence);

// استخراج معلومات من جمل أخرى
for (const sentence of allSentences) {
// محاولة استخراج معلومة مشابهة
const info = extractInfoFromSentence(sentence);
if (info && info !== correctAnswer && info.length >= 10 && info.length <= 100) {
// التأكد من أن الإجابة الخاطئة مختلفة بشكل واضح
if (similarity(info, correctAnswer) < 0.5) {
wrongAnswers.push(info);
}
}
if (wrongAnswers.length >= 6) break;
}

// إذا لم تكفِ، استخدام أجزاء من جمل أخرى
if (wrongAnswers.length < 2) {
for (const sentence of allSentences) {
const clean = sentence.replace(/[،,؛;:.!؟"']/g, '').trim();
if (clean.length >= 15 && clean.length <= 80 && clean !== correctAnswer) {
if (similarity(clean, correctAnswer) < 0.5) {
wrongAnswers.push(clean);
}
}
if (wrongAnswers.length >= 6) break;
}
}

return wrongAnswers.slice(0, 3);
}

/* ================= استخراج معلومة من جملة ================= */
function extractInfoFromSentence(sentence) {
const patterns = [
/(.{3,30}?)(?:\s+هو|\s+هي|\s+يعني|\s+تعني)\s+(.{10,100})/,
/(.{5,40}?)\s+(?:لأن|لِ)\s+(.{10,100})/,
/(?:إذا|من|كل من)\s+(.{5,40}?)\s+(?:فـ|فإن|فعليه|يجب عليه)\s+(.{10,100})/,
/(.{3,30}?)\s+(?:يتكون من|تتكون من|يشمل|تشمل)\s+(.{10,100})/,
/(.{3,30}?)\s+(?:يكون|تكون|يقع|تقع)\s+(?:في|عند|بعد|قبل)\s+(.{10,100})/
];

for (const pattern of patterns) {
const match = sentence.match(pattern);
if (match) {
return match[2].trim();
}
}

return null;
}

/* ================= حساب التشابه بين نصين ================= */
function similarity(text1, text2) {
if (!text1 || !text2) return 0;
const words1 = text1.toLowerCase().split(/\s+/).filter(w => w.length > 2);
const words2 = text2.toLowerCase().split(/\s+/).filter(w => w.length > 2);
if (words1.length === 0 || words2.length === 0) return 0;

const set1 = new Set(words1);
const set2 = new Set(words2);
const intersection = [...set1].filter(w => set2.has(w));
const union = new Set([...set1, ...set2]);

return intersection.length / union.size;
}

/* ================= التحقق من صحة السؤال ================= */
function isValidQuestion(question) {
if (!question || !question.question || !question.choices) return false;
if (question.choices.length < 3) return false; // يجب 3 خيارات على الأقل
if (question.question.length < 10) return false; // سؤال قصير جداً

// التأكد من أن الإجابة الصحيحة واضحة
if (question.correct.length < 5) return false;

// التأكد من أن جميع الخيارات مختلفة بشكل واضح
const uniqueChoices = new Set(question.choices.map(c => c.toLowerCase().trim()));
if (uniqueChoices.size < question.choices.length) return false;

return true;
}

/* ================= التحقق من أن النص ليس غامضاً ================= */
function isVague(text) {
if (!text || text.length < 10) return true;

// تجاهل النصوص التي تحتوي على كلمات غامضة
const vagueWords = ['شيء', 'أمر', 'كذا', 'كذا', 'إلخ', '...', 'وهكذا', 'إلخ'];
for (const word of vagueWords) {
if (text.includes(word)) return true;
}

// التأكد من أن النص يحتوي على كلمات ذات معنى
const words = text.split(/\s+/).filter(w => w.length > 3);
if (words.length < 3) return true;

return false;
}

/* ================= عرض الاختبار ================= */
function renderExam() {
const container = document.getElementById('examContent');
container.innerHTML = '';

examQuestions.forEach((q, index) => {
let choicesHtml = '';
q.choices.forEach((choice) => {
const safeChoice = choice.replace(/'/g, "\'").replace(/"/g, '\"');
choicesHtml += `<div class="choice" onclick="selectAnswer(${index}, '${safeChoice}', this)">${choice}</div>`;
});

container.innerHTML += `
<div class="question-box" id="q-${index}">
<h4>السؤال ${index + 1} من ${examQuestions.length}</h4>
<p class="question-text">${q.question}</p>
<div class="choices" id="choices-${index}">
${choicesHtml}
</div>
</div>
`;
});

container.innerHTML += `
<button class="btn-primary" onclick="submitExam()" style="width:100%;margin-top:20px">
✅ إنهاء الاختبار وتصحيح
</button>
`;
}

window.selectAnswer = function(qIndex, choice, element) {
const box = document.getElementById(`choices-${qIndex}`);
box.querySelectorAll('.choice').forEach(c => c.classList.remove('selected'));
element.classList.add('selected');
examQuestions[qIndex].userAnswer = choice;
};

function startTimer(seconds) {
const timerEl = document.getElementById('examTimer');
let remaining = seconds;

examTimerInterval = setInterval(() => {
remaining--;
const mins = Math.floor(remaining / 60);
const secs = remaining % 60;
timerEl.textContent = `⏱️ ${mins}:${secs.toString().padStart(2, '0')}`;

if (remaining <= 0) {
clearInterval(examTimerInterval);
submitExam();
showToast('⏰ انتهى وقت الاختبار!');
}
}, 1000);
}

window.closeExamModal = function() {
clearInterval(examTimerInterval);
document.getElementById('examModal').classList.remove('show');
};

window.submitExam = function() {
clearInterval(examTimerInterval);

let correct = 0;
examQuestions.forEach((q, i) => {
const box = document.getElementById(`choices-${i}`);
if (!box) return;

box.querySelectorAll('.choice').forEach(c => {
if (c.textContent === q.correct) c.classList.add('correct');
if (c.textContent === q.userAnswer && q.userAnswer !== q.correct) c.classList.add('wrong');
});

if (q.userAnswer === q.correct) correct++;
});

const score = correct;
const total = examQuestions.length;
const percent = Math.round((score / total) * 100);

const result = {
id: Date.now(),
name: currentExam.name,
subject: currentExam.subject,
subjectKey: currentExam.subjectKey,
chapters: currentExam.chapters,
score: score,
total: total,
percent: percent,
date: new Date().toLocaleString('ar-SA')
};

saveResult(result);
document.getElementById('examModal').classList.remove('show');
showResult(result);
};

function showResult(result) {
const container = document.getElementById('resultContent');
let emoji = result.percent >= 90 ? '🏆' : result.percent >= 80 ? '🎉' : result.percent >= 60 ? '👍' : result.percent >= 40 ? '💪' : '📚';
let message = result.percent >= 90 ? 'ممتاز! بارك الله فيك' : result.percent >= 80 ? 'أحسنت! تقدم رائع' : result.percent >= 60 ? 'جيد! واصل التقدم' : result.percent >= 40 ? 'حاول مراجعة الدروس' : 'حاول مرة أخرى';

container.innerHTML = `
<div class="result-box">
<div style="font-size:64px;margin-bottom:10px">${emoji}</div>
<h2 style="color:#f5e6b3;margin-bottom:20px">${message}</h2>
<div class="result-score">${result.score}/${result.total}</div>
<div class="result-percent">${result.percent}%</div>
<p style="color:#aaa;margin:15px 0">المادة: ${result.subject}</p>
<p style="color:#aaa;margin:5px 0">الفصول: ${result.chapters.join(' • ')}</p>
<p style="color:#aaa;margin:5px 0">التاريخ: ${result.date}</p>
<div style="margin-top:25px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
<button class="btn-primary" onclick="shareResult(${result.id})">
📤 مشاركة عبر واتساب
</button>
<button class="btn-secondary" onclick="closeResult()">
❌ إغلاق
</button>
</div>
</div>
`;

document.getElementById('resultModal').classList.add('show');
}

window.closeResult = function() {
document.getElementById('resultModal').classList.remove('show');
};

/* ================= حفظ وعرض النتائج ================= */
function saveResult(result) {
let results = JSON.parse(localStorage.getItem('examResults') || '[]');
results.push(result);
localStorage.setItem('examResults', JSON.stringify(results));
showToast('✅ تم حفظ النتيجة بنجاح!');
}

window.loadParticipants = function() {
const container = document.getElementById('participantsList');
let results = JSON.parse(localStorage.getItem('examResults') || '[]');

if (results.length === 0) {
container.innerHTML = `
<div class="empty-state">
<div style="font-size:48px;margin-bottom:15px">📭</div>
<p>لا توجد نتائج مسجلة بعد</p>
<p style="font-size:14px;margin-top:10px">أنشئ اختباراً لترى النتائج هنا</p>
</div>
`;
return;
}

results = results.reverse();

container.innerHTML = '';
results.forEach(r => {
container.innerHTML += `
<div class="participant-item">
<div class="participant-info">
<div class="participant-name">👤 ${r.name}</div>
<div class="participant-chapters">📚 ${r.subject} | 📂 ${r.chapters.join(' • ')}</div>
<div class="participant-chapters">📅 ${r.date}</div>
</div>
<div class="participant-score">${r.score}/${r.total} (${r.percent}%)</div>
<div class="participant-actions">
<button class="share-btn" onclick="shareResult(${r.id})">📤 واتساب</button>
<button class="delete-btn" onclick="deleteResult(${r.id})">🗑️ حذف</button>
</div>
</div>
`;
});
};

window.deleteResult = function(resultId) {
if (!confirm('هل أنت متأكد من حذف هذه النتيجة؟')) return;

let results = JSON.parse(localStorage.getItem('examResults') || '[]');
results = results.filter(r => r.id !== resultId);
localStorage.setItem('examResults', JSON.stringify(results));
loadParticipants();
showToast('🗑️ تم حذف النتيجة');
};

window.shareResult = function(resultId) {
let results = JSON.parse(localStorage.getItem('examResults') || '[]');
const result = results.find(r => r.id === resultId);
if (!result) return;

const text = `🎓 نتيجة الاختبار
👤 الاسم: ${result.name}
📚 المادة: ${result.subject}
📂 الفصول: ${result.chapters.join(' • ')}
✅ النتيجة: ${result.score}/${result.total}
📊 النسبة: ${result.percent}%
📅 التاريخ: ${result.date}

🌟 تم الاختبار عبر تطبيق التعليم`;

const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
window.open(url, '_blank');
};

/* ================= إشعارات ================= */
window.showToast = function(message) {
const toast = document.getElementById('toast');
toast.textContent = message;
toast.classList.add('show');
setTimeout(() => toast.classList.remove('show'), 3000);
};

/* تشغيل */
loadChapters();

</script>
