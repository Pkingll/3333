<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عرض المادة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Cairo,sans-serif;
}

body{
background:#06131f;
color:#fff;
min-height:100vh;
}

body:before{
content:"";
position:fixed;
inset:0;
z-index:-1;
background:
linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.85)),
url('https://a.top4top.io/p_38068co2c0.jpg');
background-size:cover;
background-position:center;
}

.header{
text-align:center;
padding:20px;
color:#f5e6b3;
}

.content{
width:92%;
max-width:900px;
margin:20px auto;
background:rgba(5,15,30,.65);
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
padding:20px;
line-height:2;
}

.content img{
width:100%;
border-radius:12px;
margin:10px 0;
}

.content a{
display:block;
margin:10px 0;
padding:12px;
background:#0d2033;
border-radius:10px;
color:#f5e6b3;
text-decoration:none;
}

.back{
position:fixed;
bottom:15px;
left:15px;
background:#d4af37;
border:none;
padding:12px;
border-radius:12px;
cursor:pointer;
}

.audio-box{
margin-top:10px;
background:#0d2033;
padding:10px;
border-radius:12px;
}
</style>
</head>

<body>

<div class="header" id="title">المادة</div>

<div class="content" id="content"></div>

<button class="back" onclick="location.href='index.html'">رجوع</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAVHnPVmRegwOQGTugDN7oltRqlSM-5_wA",
authDomain: "p-726bc.firebaseapp.com",
projectId: "p-726bc",
storageBucket: "p-726bc.firebasestorage.app",
messagingSenderId: "752913389065",
appId: "1:752913389065:web:20cf8c03fe4ace03650ad8"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
const id = params.get("id");

document.getElementById("title").innerText = id;

const snap = await getDoc(doc(db,"subjects",id));

const content = document.getElementById("content");

if(snap.exists()){

const data = snap.data();

(data.items || []).forEach(item=>{

if(item.type==="title"){
content.innerHTML += `<h2>${item.text}</h2>`;
}

if(item.type==="text"){
content.innerHTML += `<p>${item.text}</p>`;
}

if(item.type==="image"){
content.innerHTML += `<img src="${item.url}">`;
}

if(item.type==="book"){
content.innerHTML += `<a href="${item.url}" target="_blank">📚 ${item.name}</a>`;
}

if(item.type==="link"){
content.innerHTML += `<a href="${item.url}" target="_blank">🔗 ${item.name}</a>`;
}

if(item.type==="audio"){
content.innerHTML += `
<div class="audio-box">
🎧 ${item.name}
<audio controls src="${item.url}"></audio>
</div>`;
}

});

}else{
content.innerHTML = "<p>لا يوجد محتوى</p>";
}

</script>

</body>
</html>
