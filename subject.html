<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المواد</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Cairo;
background:#06131f;
color:white;
}

body::before{
content:"";
position:fixed;
inset:0;
z-index:-1;
background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.85)),
url('https://a.top4top.io/p_38068co2c0.jpg');
background-size:cover;
background-position:center;
}

/* العنوان */
.header{
text-align:center;
padding:20px;
color:#f5e6b3;
font-size:22px;
font-weight:bold;
}

/* الأزرار */
.container{
width:92%;
max-width:900px;
margin:auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
padding-bottom:80px;
}

.btn{
background:rgba(5,15,30,.7);
border:1px solid rgba(255,255,255,.15);
padding:18px;
border-radius:15px;
text-align:center;
cursor:pointer;
transition:.3s;
color:#f5e6b3;
font-weight:bold;
text-decoration:none;
}

.btn:hover{
transform:translateY(-5px);
border-color:#d4af37;
}

/* صفحة الباب */
.page{
width:92%;
max-width:800px;
margin:20px auto;
background:rgba(5,15,30,.7);
padding:20px;
border-radius:15px;
display:none;
}

.page h2{
color:#f5e6b3;
}

img{
width:100%;
border-radius:12px;
margin-top:10px;
}

audio{
width:100%;
margin-top:10px;
}

.back{
margin-top:15px;
background:#d4af37;
border:none;
padding:10px;
border-radius:10px;
cursor:pointer;
width:100%;
}
</style>
</head>

<body>

<div class="header" id="title">الأبواب</div>

<!-- قائمة الأبواب -->
<div class="container" id="chaptersList"></div>

<!-- صفحة الباب -->
<div class="page" id="chapterPage">
<h2 id="chapterTitle"></h2>
<p id="chapterContent"></p>
<img id="chapterImg" style="display:none;">
<audio id="chapterAudio" controls style="display:none;"></audio>

<button class="back" onclick="back()">رجوع</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAVHnPVmRegwOQGTugDN7oltRqlSM-5_wA",
authDomain: "p-726bc.firebaseapp.com",
projectId: "p-726bc",
storageBucket: "p-726bc.firebasestorage.app",
messagingSenderId: "752913389065",
appId: "1:752913389065:web:20cf8c03fe4ace03650ad8"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
const subject = params.get("id");

const list = document.getElementById("chaptersList");
const page = document.getElementById("chapterPage");

let chapters = [];

async function loadChapters(){

const q = query(collection(db,"chapters"), where("subject","==",subject));
const snap = await getDocs(q);

snap.forEach(doc=>{
chapters.push({id:doc.id,...doc.data()});
});

render();
}

function render(){

list.innerHTML="";

chapters.forEach((ch,i)=>{
list.innerHTML += `
<a class="btn" onclick="openChapter(${i})">
📘 ${ch.title}
</a>
`;
});
}

window.openChapter = (i)=>{
const ch = chapters[i];

document.getElementById("chapterTitle").innerText = ch.title;
document.getElementById("chapterContent").innerText = ch.content;

const img = document.getElementById("chapterImg");
const audio = document.getElementById("chapterAudio");

if(ch.image){
img.src = ch.image;
img.style.display="block";
}else{
img.style.display="none";
}

if(ch.audio){
audio.src = ch.audio;
audio.style.display="block";
}else{
audio.style.display="none";
}

list.style.display="none";
page.style.display="block";
};

window.back = ()=>{
page.style.display="none";
list.style.display="grid";
};

loadChapters();

</script>

</body>
</html>
