<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طالبة علم شرعي - السنة الثانية</title>

<meta property="og:title" content="طالبة علم شرعي - السنة الثانية" />
<meta property="og:description" content="منصة الملخصات والكتب والفوائد العلمية" />
<meta property="og:image" content="https://a.top4top.io/p_38068co2c0.jpg" />
<meta property="og:url" content="https://pkingll.github.io/3333/" />
<meta property="og:type" content="website" />

<style>
body{
margin:0;
font-family:Cairo,sans-serif;
background:#06131f;
color:white;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
inset:0;
z-index:-1;
background:
linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.85)),
url('https://a.top4top.io/p_38068co2c0.jpg');
background-size:cover;
background-position:center;
}

.menu-btn{
position:fixed;
top:15px;
left:15px;
z-index:1000;
cursor:pointer;
}

.menu-btn div{
width:32px;
height:4px;
margin:6px 0;
background:#d4af37;
border-radius:5px;
}

.sidebar{
position:fixed;
top:0;
left:-260px;
width:240px;
height:100%;
background:#0b1725;
transition:.4s;
padding:20px;
z-index:999;
}

.sidebar.active{left:0;}

.sidebar button{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:10px;
cursor:pointer;
background:#d4af37;
font-weight:bold;
}

.marquee{
overflow:hidden;
white-space:nowrap;
background:rgba(0,0,0,.45);
padding:12px 0;
}

.marquee span{
display:inline-block;
padding-left:100%;
animation:move 20s linear infinite;
color:#f5e6b3;
}

@keyframes move{
0%{transform:translateX(0)}
100%{transform:translateX(-100%)}
}

/* ===== الصندوق الأساسي (تم إرجاعه) ===== */
.intro-box{
display:block;
margin:20px;
padding:30px;
border-radius:18px;
background:
linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.65)),
url('https://a.top4top.io/p_3807ka9e10.jpg');
background-size:cover;
background-position:center;
border:1px solid rgba(255,255,255,.15);
text-align:center;
box-shadow:0 0 25px rgba(0,0,0,.4);
color:#fff;
text-decoration:none;
transition:0.4s ease;
}

.intro-box:hover{
transform:translateY(-5px) scale(1.01);
}

.intro-box h2{
margin:0;
color:#f5e6b3;
font-size:20px;
}

/* ===== زر مشاركة الملخصات (تم إرجاعه بوضوح) ===== */
.share-card{
display:block;
margin:20px;
padding:25px;
border-radius:18px;
background:rgba(212,175,55,.12);
border:1px dashed rgba(212,175,55,.6);
text-align:center;
cursor:pointer;
position:relative;
transition:.3s;
}

.share-card:hover{
transform:translateY(-5px);
}

.share-badge{
position:absolute;
top:10px;
left:10px;
background:rgba(0,0,0,.6);
border:1px solid #d4af37;
color:#d4af37;
padding:4px 10px;
border-radius:20px;
font-size:12px;
}

/* المواد */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;
padding:25px;
}

.card{
background:rgba(5,15,30,.6);
border:1px solid rgba(255,255,255,.12);
border-radius:18px;
padding:20px;
text-decoration:none;
color:white;
transition:.3s;
}

.card:hover{
transform:translateY(-6px);
border-color:#d4af37;
}

.card h3{
margin:0;
color:#f5e6b3;
}

.summary{
margin-top:10px;
font-size:14px;
opacity:.85;
}
</style>
</head>

<body>

<div class="menu-btn" onclick="toggleMenu()">
<div></div><div></div><div></div>
</div>

<div class="sidebar" id="sidebar">
<button onclick="openAdmin()">لوحة الأدمن</button>
<button onclick="closeMenu()">إغلاق</button>
</div>

<div class="marquee">
<span>طالبة علم شرعي سنة تانية — منصة الملخصات والكتب والفوائد العلمية</span>
</div>

<!-- 🔥 الصندوق الذي طلبتيه (تم إرجاعه بالكامل) -->
<a class="intro-box" href="https://www.facebook.com/share/1GfgZ1JQGy/" target="_blank">
<h2>طالبة علم شرعي سنة تانية في المعهد الديني - سبها</h2>
</a>

<!-- 📤 مربع مشاركة الملخصات (رجعته لك) -->
<a class="share-card" href="#" onclick="shareSite(); return false;">
<div class="share-badge" id="shareCount">0</div>
<h3>📤 مشاركة الملخصات</h3>
<div class="summary">شارك الموقع مع زملائك بسهولة</div>
</a>

<!-- المواد -->
<div class="grid">

<a class="card" href="subject.html?id=aqida">
<h3>العقيدة</h3>
<div class="summary">ملخصات العقيدة وأصول الإيمان</div>
</a>

<a class="card" href="subject.html?id=hadith">
<h3>الحديث</h3>
<div class="summary">الأحاديث النبوية وشروحها</div>
</a>

<a class="card" href="subject.html?id=fiqh">
<h3>الفقه</h3>
<div class="summary">الأحكام الفقهية والعبادات</div>
</a>

<!-- باقي المواد كما هي -->

</div>

<script>
function toggleMenu(){
document.getElementById("sidebar").classList.toggle("active");
}

function closeMenu(){
document.getElementById("sidebar").classList.remove("active");
}

function openAdmin(){
const pass = prompt("أدخل كلمة مرور الأدمن");
if(pass === "1997"){
window.location.href="admin.html";
}else{
alert("كلمة المرور غير صحيحة");
}
}

/* عداد المشاركة */
let count = localStorage.getItem("shareCount") || 0;
document.getElementById("shareCount").innerText = count;

function shareSite() {
const data = {
title: "طالبة علم شرعي سنة تانية",
text: "ادخل هذا الموقع وشاهد الملخصات 👇",
url: "https://pkingll.github.io/3333/"
};

if (navigator.share) {
navigator.share(data);
} else {
navigator.clipboard.writeText(data.url);
alert("تم نسخ الرابط 📋");
}

count++;
localStorage.setItem("shareCount", count);
document.getElementById("shareCount").innerText = count;
}
</script>

</body>
</html>
